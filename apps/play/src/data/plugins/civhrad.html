<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hexagon Empires</title>
    <script type="application/oqse-manifest+json">
{
  "version": "0.2",
  "id": "https://memizy.com/plugins/hexagon-empires",
  "appName": "Hexagon Empires",
  "pluginVersion": "2.0.0",
  "capabilities": {
    "actions": ["render"],
    "types": ["note"],
    "features": ["markdown"]
  },
  "appSpecific": {
    "memizy": {
      "protocol": "1.0",
      "modes": {
        "solo": {},
        "multiplayer": { "players": { "min": 1, "max": 8 }, "hostAs": ["presenter", "player"], "lateJoin": true }
      },
      "settings": [
        { "id": "map", "type": "select", "label": { "cs": "Mapa (kampaň)", "en": "Map (campaign)" }, "default": "classic",
          "options": [
            { "value": "classic", "label": { "cs": "Klasické kontinenty", "en": "Classic Continents" } },
            { "value": "bastion", "label": { "cs": "Železná bašta (kooperace)", "en": "The Iron Bastion (co-op)" } },
            { "value": "eldorado", "label": { "cs": "Zlaté pobřeží El Dorada", "en": "Gold Coast of El Dorado" } },
            { "value": "horde", "label": { "cs": "Horda z východu (kooperace)", "en": "The Eastern Horde (co-op)" } },
            { "value": "aurelia", "label": { "cs": "Spojenec Aurelie", "en": "The Ally of Aurelia" } },
            { "value": "ring", "label": { "cs": "Války o prsten", "en": "The Ring Wars" } },
            { "value": "neon", "label": { "cs": "Neonový horizont", "en": "Neon Horizon" } },
            { "value": "holy", "label": { "cs": "Svatá válka", "en": "Holy War" } }
          ] },
        { "id": "speed", "type": "select", "label": { "cs": "Rychlost hry", "en": "Game speed" }, "default": "standard",
          "options": [
            { "value": "standard", "label": { "cs": "Standardní", "en": "Standard" } },
            { "value": "fast", "label": { "cs": "Rychlá (cca 30 tahů)", "en": "Fast (about 30 turns)" } }
          ] },
        { "id": "difficulty", "type": "select", "label": { "cs": "Obtížnost", "en": "Difficulty" }, "default": "hard",
          "options": [
            { "value": "normal", "label": { "cs": "Normální", "en": "Normal" } },
            { "value": "hard", "label": { "cs": "Těžká", "en": "Hard" } },
            { "value": "brutal", "label": { "cs": "Brutální", "en": "Brutal" } }
          ] },
        { "id": "turns", "type": "number", "label": { "cs": "Počet tahů", "en": "Number of turns" }, "default": 70, "min": 20, "max": 120 },
        { "id": "turnTime", "type": "number", "label": { "cs": "Čas na tah (s)", "en": "Time per turn (s)" }, "default": 90, "min": 20, "max": 300, "modes": ["multiplayer"] },
        { "id": "aiRivals", "type": "number", "label": { "cs": "Počítačoví soupeři", "en": "AI rivals" }, "default": 2, "min": 0, "max": 5, "modes": ["solo"] },
        { "id": "aiRivalsMp", "type": "number", "label": { "cs": "Počítačoví soupeři", "en": "AI rivals" }, "default": 0, "min": 0, "max": 4, "modes": ["multiplayer"] }
      ]
    }
  }
}
</script>
    <style>
        :root {
            color-scheme: light dark;
            --bg: light-dark(#ece3cf, #11141b);
            --pn: light-dark(#fbf6ea, #1b202b);
            --pn2: light-dark(#f1e6cd, #252c3a);
            --fg: light-dark(#2a2216, #eee6d3);
            --mut: light-dark(#76664c, #9aa6ba);
            --acc: light-dark(#a06d10, #e7b85a);
            --acc-fg: light-dark(#fff, #17130b);
            --bd: light-dark(#d6c49c, #3a4560);
            --good: light-dark(#1d7a45, #5fd492);
            --bad: light-dark(#b02c20, #ff7f6e);
            --sci: light-dark(#1f5fa8, #7cc4ff);
            --cul: light-dark(#7b2fa0, #e3a6ff);
            --gold: light-dark(#8a6400, #ffd257);
            font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--fg);
        }

        h1,
        h2,
        h3 {
            margin: .2em 0;
            letter-spacing: .02em;
        }

        button {
            font: inherit;
            color: inherit;
            background: var(--pn2);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 8px 12px;
            min-height: 44px;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            border-color: var(--acc);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
            color: inherit;
        }

        button.pri {
            background: var(--acc);
            color: var(--acc-fg);
            border-color: var(--acc);
            font-weight: 700;
        }

        button.sm {
            min-height: 36px;
            padding: 4px 10px;
            font-size: .9rem;
        }

        button.on {
            outline: 3px solid var(--acc);
            outline-offset: 1px;
        }

        .mut {
            color: var(--mut);
        }

        .good {
            color: var(--good);
        }

        .bad {
            color: var(--bad);
        }

        .small {
            font-size: .86rem;
        }

        .tiny {
            font-size: .76rem;
        }

        .row {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .grow {
            flex: 1;
        }

        .list {
            display: grid;
            gap: 6px;
        }

        .app {
            max-width: 1280px;
            margin: auto;
            padding: 12px;
            display: grid;
            gap: 12px;
            font-size: 1.04rem;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: var(--pn);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 8px 12px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.15rem;
            cursor: pointer;
            user-select: none;
            letter-spacing: .04em;
        }

        .chip {
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--pn2);
            border: 1px solid var(--bd);
            white-space: nowrap;
            font-size: .9rem;
        }

        .card {
            background: var(--pn);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 12px;
        }

        .card h3 {
            font-size: 1.05rem;
        }

        .opt {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--pn2);
        }

        .opt .t {
            font-size: .82rem;
            color: var(--mut);
        }

        .hp {
            height: 7px;
            border-radius: 4px;
            background: #0003;
            overflow: hidden;
        }

        .hp>i {
            display: block;
            height: 100%;
            background: var(--good);
        }

        .bar2 {
            height: 8px;
            border-radius: 5px;
            background: #0002;
            overflow: hidden;
            min-width: 60px;
        }

        .bar2>i {
            display: block;
            height: 100%;
            background: var(--acc);
        }

        .log {
            max-height: 60vh;
            overflow: auto;
            display: grid;
            gap: 4px;
            font-size: .9rem;
        }

        .log div {
            padding: 3px 7px;
            border-left: 3px solid var(--bd);
        }

        .log .k-war {
            border-color: var(--bad);
        }

        .log .k-good {
            border-color: var(--good);
        }

        .log .k-fun {
            border-color: #9b59b6;
            font-style: italic;
        }

        .log .k-mom {
            border-color: var(--acc);
            font-weight: 700;
        }

        .log .k-rel {
            border-color: #d4a017;
        }

        .score {
            width: 100%;
            border-collapse: collapse;
            font-size: .9rem;
        }

        .score td,
        .score th {
            padding: 5px 4px;
            border-bottom: 1px solid var(--bd);
            text-align: left;
            vertical-align: middle;
        }

        .score td.n {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .pick {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 8px;
        }

        .pick button {
            text-align: left;
            display: grid;
            gap: 3px;
            align-content: start;
            min-height: 92px;
        }

        .pick button .t {
            font-size: .84rem;
            color: var(--mut);
        }

        .pick button.mine {
            background: color-mix(in srgb, var(--acc) 22%, var(--pn2));
            border-color: var(--acc);
        }

        .pick button .who {
            font-size: .8rem;
            font-weight: 700;
            color: var(--acc);
        }

        .maps {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 8px;
        }

        .maps button {
            text-align: left;
            display: grid;
            gap: 3px;
            align-content: start;
        }

        .maps button .t {
            font-size: .82rem;
            color: var(--mut);
        }

        .hero {
            text-align: center;
            padding: 18px 10px;
        }

        .hero .big {
            font-size: 2.8rem;
        }

        .flag {
            vertical-align: middle;
            border-radius: 2px;
        }

        .quote {
            font-style: italic;
            color: var(--mut);
        }

        .goal {
            border-left: 4px solid var(--acc);
            padding-left: 8px;
        }

        .dice {
            display: inline-flex;
            gap: 2px;
            font-size: 1.7rem;
            line-height: 1;
        }

        .dice span {
            display: inline-block;
            animation: roll .9s cubic-bezier(.2, .8, .3, 1) both;
        }

        .dice span:nth-child(2) {
            animation-delay: .15s;
        }

        @keyframes roll {
            0% {
                transform: rotate(-540deg) scale(.3);
                opacity: 0;
            }

            100% {
                transform: none;
                opacity: 1;
            }
        }

        .order {
            display: grid;
            gap: 6px;
        }

        .order .opt.now {
            border-color: var(--acc);
            box-shadow: 0 0 0 2px var(--acc) inset;
        }

        .stars {
            color: #f5b301;
            letter-spacing: -1px;
        }

        .kv {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 2px 10px;
            font-size: .86rem;
        }

        .kv b {
            font-variant-numeric: tabular-nums;
        }

        .help li {
            margin: 3px 0;
        }

        .help table {
            border-collapse: collapse;
            font-size: .85rem;
        }

        .help td {
            padding: 2px 8px 2px 0;
        }

        .board {
            font-size: 1.2rem;
        }

        .retro {
            font-family: "Courier New", monospace;
        }

        .retro #map svg,
        .retro #map canvas {
            filter: saturate(1.7) contrast(1.15);
            image-rendering: pixelated;
        }

        /* hex map (2D fallback) */
        .hexmap .tile {
            stroke: #0000002a;
            stroke-width: .6;
            cursor: pointer;
        }

        .t-g {
            fill: #93bf5c;
        }

        .t-p {
            fill: #d2c472;
        }

        .t-h {
            fill: #b38c5a;
        }

        .t-f {
            fill: #5b9651;
        }

        .t-d {
            fill: #e8d596;
        }

        .t-t {
            fill: #b5c0b3;
        }

        .t-j {
            fill: #2f8a5a;
        }

        .t-v {
            fill: #77685f;
        }

        .t-m {
            fill: #9b9b9b;
        }

        .t-w {
            fill: #4d9fd8;
        }

        .hexmap .fog {
            fill: #2a2f3a;
            stroke: #ffffff10;
            stroke-width: .6;
            cursor: pointer;
        }

        .hexmap .dim {
            fill: #000;
            opacity: .3;
            pointer-events: none;
        }

        .hexmap text {
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .hexmap .nopt {
            pointer-events: none;
        }

        .hexmap .hl-move {
            fill: #fff;
            fill-opacity: .3;
            stroke: #fff;
            stroke-width: 1.4;
            stroke-dasharray: 3 2;
            cursor: pointer;
        }

        .hexmap .hl-att {
            fill: #e74c3c;
            fill-opacity: .32;
            stroke: #ff3b2f;
            stroke-width: 2;
            cursor: crosshair;
        }

        .hexmap .hl-trv {
            fill: #f1c40f;
            fill-opacity: .35;
            stroke: #f1c40f;
            stroke-width: 2;
            cursor: pointer;
        }

        .hexmap .hl-sel {
            fill: none;
            stroke: #ffd54a;
            stroke-width: 2.6;
            pointer-events: none;
        }

        .hexmap .lbl {
            font-size: 6.6px;
            font-weight: 700;
            fill: #fff;
            paint-order: stroke;
            stroke: #000b;
            stroke-width: 2.2px;
        }

        .hexmap .ic {
            font-size: 12px;
        }

        .hexmap .ics {
            font-size: 7.5px;
        }

        /* ===== in-game HUD (map fills the screen, panels float above it) ===== */
        .game {
            --hb: light-dark(#fbf4e3f2, #0e1726f2);
            --hb2: light-dark(#efe2c4, #1a2b4a);
            --hfg: light-dark(#2a2012, #f3ead4);
            --hmut: light-dark(#6f5f45, #aab6c8);
            --gl: light-dark(#a8781c, #d8b25a);
            --line: light-dark(#c9b27c, #3a5785);
            --bd: var(--line);
            --fg: var(--hfg);
            --mut: var(--hmut);
            --pn: var(--hb);
            --pn2: var(--hb2);
            --acc: var(--gl);
            position: fixed;
            inset: 0;
            overflow: hidden;
            color: var(--hfg);
            font-size: 15px;
            background: light-dark(#a9cbe6, #0b1420);
        }

        .game #map {
            position: absolute;
            inset: 0;
        }

        .game #map canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }

        .game #map svg {
            width: 100%;
        }

        .game.zoom #map svg {
            width: 210%;
        }

        .hud {
            position: absolute;
        }

        .game.photo .hud:not(.hud-ctl) {
            display: none;
        }

        .hud-top {
            top: 0;
            left: 0;
            right: 0;
            z-index: 3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 14px;
            padding: 6px 12px;
            background: linear-gradient(180deg, var(--hb), color-mix(in srgb, var(--hb) 88%, transparent));
            border-bottom: 2px solid var(--gl);
            box-shadow: 0 4px 16px #0007;
        }

        .yd {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-size: 1rem;
        }

        .yd b {
            font-size: 1.12rem;
            font-variant-numeric: tabular-nums;
        }

        .yd i {
            font-style: normal;
            font-size: .9rem;
            font-weight: 700;
        }

        .yd.gold b {
            color: var(--gold);
        }

        .yd.sci b {
            color: var(--sci);
        }

        .yd.cul b {
            color: var(--cul);
        }

        .yd.win b {
            color: light-dark(#9a6a12, #ffe08a);
        }

        .yd.warn {
            color: var(--bad);
            font-weight: 800;
        }

        .plus {
            color: light-dark(#1f7a47, #6be29b);
        }

        .minus {
            color: light-dark(#b03024, #ff7d6b);
        }

        .mini {
            display: inline-block;
            width: 46px;
            height: 5px;
            background: #0004;
            border-radius: 3px;
            overflow: hidden;
        }

        .mini>span {
            display: block;
            height: 100%;
            background: currentColor;
        }

        .yd.sci .mini {
            color: #4aa8ff;
        }

        .yd.cul .mini {
            color: #c77dff;
        }

        .yd.win .mini {
            color: #f5b301;
        }

        .game .hbtn {
            background: var(--hb2);
            border: 1px solid var(--line);
            color: var(--hfg);
            border-radius: 10px;
            min-height: 40px;
            padding: 5px 11px;
            font-weight: 700;
        }

        .game .hbtn.on {
            background: var(--gl);
            color: #1a1408;
            border-color: var(--gl);
        }

        .hud-ctl {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: grid;
            gap: 8px;
            z-index: 2;
        }

        .game .hud-ctl button {
            width: 46px;
            height: 46px;
            min-height: 0;
            padding: 0;
            border-radius: 50%;
            background: var(--hb);
            border: 2px solid var(--gl);
            color: var(--hfg);
            font-size: 1.2rem;
            font-weight: 800;
            box-shadow: 0 3px 10px #0006;
        }

        .hud-quest {
            top: 58px;
            left: 66px;
            z-index: 2;
            max-width: min(380px, calc(100% - 80px));
            padding: 6px 10px !important;
            font-size: .88rem;
        }

        .hud-bottom {
            left: 10px;
            right: 10px;
            bottom: 10px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            pointer-events: none;
            z-index: 2;
        }

        .hud-bottom>* {
            pointer-events: auto;
        }

        .hud-sel {
            width: min(450px, 100%);
            max-height: 52vh;
            overflow: auto;
            border-radius: 14px;
        }

        .game .card {
            background: var(--hb);
            border: 2px solid var(--gl);
            border-radius: 14px;
            color: var(--hfg);
            box-shadow: 0 6px 22px #0008;
            padding: 12px;
        }

        .game .card h3 {
            color: var(--gl);
        }

        .game .opt {
            background: var(--hb2);
            border-color: var(--line);
        }

        .game button {
            color: var(--hfg);
            background: var(--hb2);
            border-color: var(--line);
            white-space: normal;
            max-width: 100%;
        }

        .game .card,
        .hud-sel,
        .hud-sel * {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .game button.pri {
            background: var(--gl);
            color: #1a1408;
            border-color: var(--gl);
        }

        .game button.warb {
            background: #b8382b;
            color: #fff;
            border-color: #ff8a7a;
            font-weight: 800;
        }

        .endwrap {
            margin-left: auto;
            display: grid;
            justify-items: center;
            gap: 6px;
        }

        .game .endbtn {
            width: 124px;
            height: 124px;
            border-radius: 50%;
            border: 4px solid var(--gl);
            color: #fff;
            font-weight: 800;
            letter-spacing: .05em;
            font-size: 1rem;
            line-height: 1.15;
            padding: 8px;
            background: radial-gradient(circle at 50% 30%, #3a6fb0, #0f2341);
            box-shadow: 0 0 0 5px #0009, 0 10px 26px #000b;
        }

        .game .endbtn.ready {
            background: radial-gradient(circle at 50% 30%, #43a457, #113d1c);
            animation: endpulse 1.6s infinite;
        }

        .game .endbtn.done {
            background: radial-gradient(circle at 50% 30%, #5b6472, #1f2630);
        }

        .endbtn .sub {
            display: block;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: 0;
            opacity: .9;
            margin-top: 4px;
        }

        @keyframes endpulse {
            50% {
                box-shadow: 0 0 0 5px #0009, 0 0 30px 8px #ffd25799;
            }
        }

        .endinfo {
            background: var(--hb);
            border: 2px solid var(--gl);
            border-radius: 999px;
            padding: 4px 12px;
            font-weight: 800;
            font-size: 1rem;
        }

        .drawer {
            top: 60px;
            right: 10px;
            bottom: 150px;
            width: min(440px, calc(100% - 20px));
            overflow: auto;
            z-index: 4;
        }

        .hud-news {
            top: 66px;
            left: 50%;
            transform: translateX(-50%);
            width: min(600px, calc(100% - 20px));
            z-index: 5;
        }

        .hud-news ul {
            margin: 6px 0 0;
            padding-left: 20px;
            max-height: 38vh;
            overflow: auto;
        }

        .toast {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            margin: auto;
            width: max-content;
            max-width: 92vw;
            background: var(--acc);
            color: var(--acc-fg);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 6;
            box-shadow: 0 8px 20px #0006;
        }

        .game .toast {
            background: var(--gl);
            color: #1a1408;
        }

        .tabs2 {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .tabs2 button {
            flex: 1;
            min-height: 36px;
            padding: 4px 6px;
            font-size: .86rem;
        }

        .tabs2 button.on {
            background: var(--gl);
            color: #1a1408;
            outline: none;
        }

        .recruit {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .recruit button {
            display: grid;
            gap: 1px;
            text-align: left;
            padding: 6px 8px;
            min-height: 54px;
            font-size: .85rem;
        }

        .recruit button b {

            margin-top: 8px;
            background: color-mix(in srgb, #e05a4a 12%, transparent);
        }

            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 6px;
            align-items: center;
            text-align: center;
        }

        .vs .big {
            font-size: 1.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }

        .mods {
            font-size: .76rem;
            color: var(--mut);
        }

            display: inline-block;
            padding: 1px 7px;
            border-radius: 999px;
            font-size: .78rem;
            font-weight: 700;
            background: #0002;
        }

            background: #2e8b57;
            color: #fff;
        }

            background: #2f6fd6;
            color: #fff;
        }

            background: #b8382b;
            color: #fff;
        }

        .pill.heg {
            background: #f5b301;
            color: #1a1408;
        }

        .hud-emo {
            top: 62px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            z-index: 5;
            pointer-events: none;
            max-width: 90vw;
        }

        .emo {
            background: var(--hb);
            border: 2px solid var(--gl);
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 1.05rem;
            box-shadow: 0 4px 14px #0007;
            animation: pop .35s cubic-bezier(.2, 1.6, .4, 1) both;
        }

        @keyframes pop {
            0% {
                transform: scale(.2);
                opacity: 0;
            }

            100% {
                transform: none;
                opacity: 1;
            }
        }

        .emopal {
            position: absolute;
            left: 62px;
            top: 0;
            display: flex;
            gap: 4px;
            background: var(--hb);
            border: 2px solid var(--gl);
            border-radius: 999px;
            padding: 4px 8px;
        }

        .game .emopal button {
            width: 38px;
            height: 38px;
            min-height: 0;
            padding: 0;
            border: none;
            background: transparent;
            font-size: 1.3rem;
            box-shadow: none;
        }

        .chart {
            width: 100%;
            max-width: 760px;
            height: auto;
            display: block;
            margin: auto;
        }

        .ach {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ach span {
            border: 1px solid var(--bd);
            border-radius: 999px;
            padding: 3px 9px;
            background: var(--pn2);
            font-size: .88rem;
        }

        .ach span.new {
            border-color: var(--acc);
            background: color-mix(in srgb, var(--acc) 22%, var(--pn2));
            font-weight: 700;
        }

        .game.board {
            font-size: 1.15rem;
        }

        .game.board .drawer {
            bottom: 10px;
            width: min(480px, 42%);
        }

        @media (max-width: 1500px) {

            .hud-top .hbtn .hlbl,
            .hud-top .yd .hlbl {
                display: none;
            }

            .hud-top {
                gap: 4px 11px;
            }
        }

        @media (max-width: 760px) {
            .game {
                font-size: 14px;
            }

            .hlbl,
            .mini {
                display: none !important;
            }

            .hud-top {
                gap: 2px 10px;
                padding: 5px 8px;
            }

            .hud-quest {
                top: auto;
                bottom: 0;
                display: none;
            }

            .hud-bottom {
                flex-direction: column-reverse;
                align-items: stretch;
                left: 6px;
                right: 6px;
                bottom: 6px;
                gap: 6px;
            }

            .endwrap {
                display: flex;

                align-items: center;
                justify-content: flex-end;

                height: 88px;

            }

            .drawer {
                top: 54px;
                bottom: 6px;

                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .recruit {
                grid-template-columns: 1fr;
            }
        }

      ${fin.map((r, i) => {
                const p = st.pl[r.id]; return ui.html`<tr><td>${['🥇', '🥈', '🥉'][i] || i + 1}</td><td>${ui.raw(flagSvg(p.pan))}</td>
        <td><b>${p.nm}</b><div class="small mut">${LEADERS[p.leader].e} ${LEADERS[p.leader].n}</div></td>
        <td class="n">${coop(st) ? r.contrib : `${r.prog}%`}</td><td class="n"><b>${r.score}</b></td>
        <td class="small">⚔️ ${r.dom}% · ${MAPS[st.map].e} ${r.map}% · ${r.kills} kills · ${p.tech.length} techs · ${myCities(st, r.id).length} cities</td></tr>`;
            })}
    </table></div>
    ${saved && ui.self ? ui.html`<div class="card">🏛️ Your record: ${saved.games || 0} games, ${saved.wins || 0} wins</div>` : ''}
    ${historyChart(st, ui)}
    ${ui.self && st.pl[ui.self.id] ? ui.html`<div class="card"><h3>🏅 Achievements this game</h3>
      ${earnedAch(st, ui.self.id).length ? achList(ui, earnedAch(st, ui.self.id), G.newAch || []) : ui.html`<span class="mut small">None this time — history is long.</span>`}
      ${(G.newAch || []).length ? ui.html`<div class="small good" style="margin-top:4px">New for your collection: ${(G.newAch || []).map((k) => ACH[k][0]).join(' ')}</div>` : ''}</div>` : ''}
    <div class="card"><h3>📜 Chronicle</h3>${logTab(st, ui)}</div>
  </div>`;
        }

        /* =====================================================================
           GAME DEFINITION
           ===================================================================== */
        const meP = (st, ctx) => { const p = ctx.playerId && st.pl[ctx.playerId]; return p && !p.spec && !p.ai && !p.dead && st.order.includes(p.id) ? p : null; };
        const myUnit = (st, P, id) => st.units.find((u) => u.i === id && u.o === P.id);
        const myCity = (st, P, id) => st.cities.find((c) => c.i === id && c.o === P.id);
        /** Every action bumps the version (screens redraw the map) and ends the game on a victory. */
        const A = (fn) => (st, pl, ctx) => {
            fn(st, pl && typeof pl === 'object' ? pl : {}, ctx);
            st.v = (st.v || 0) + 1;
            if (st.win && st.phase === 'turn') ctx.goto('end');
        };
        /** Game actions need a living human player of this world. */
        const PA = (fn) => A((st, pl, ctx) => {
            if (st.phase === 'setup' && ctx.playerId && !st.pl[ctx.playerId]) addHuman(st, ctx.players.find((p) => p.id === ctx.playerId) || { id: ctx.playerId });
            const P = meP(st, ctx);
            if (P) fn(st, pl, ctx, P);
        });
        function addHuman(st, pl) {
            if (st.pl[pl.id]) return;
            st.pl[pl.id] = newPlayer(pl.id, pl.name || 'Player', false);
            st.order.push(pl.id);
        }
        function allDone(st, ctx) {
            if (st.phase !== 'turn') return;
            const hs = ctx.players.filter((p) => p.connected && meP(st, { playerId: p.id }));
            if (hs.length && hs.every((p) => st.pl[p.id].done)) ctx.goto('events');
        }
        const freeLeaders = (st) => Object.keys(LEADERS).filter((k) => !st.order.some((id) => st.pl[id].leader === k));
        const freePans = (st) => Object.keys(PAN).filter((k) => !st.order.some((id) => st.pl[id].pan === k));
        const PICK_PREF = {
            bastion: ['tomyris', 'qin', 'augustus', 'olymp', 'kami', 'devas'], horde: ['qin', 'augustus', 'tomyris', 'olymp', 'devas', 'kami'],
            eldorado: ['mansa', 'elizabeth', 'tomyris', 'druids', 'aesir'], holy: ['pericles', 'cleopatra', 'gilgamesh', 'olymp', 'teotl'],
            ring: ['gilgamesh', 'tomyris', 'aesir', 'kami'], neon: ['elizabeth', 'qin', 'ennead', 'olymp'], aurelia: ['gilgamesh', 'augustus', 'aesir', 'olymp'],
            classic: ['pericles', 'qin', 'augustus', 'ennead', 'olymp'],
        };
        function aiDraftChoice(st, ctx, kind) {
            const free = kind === 'L' ? freeLeaders(st) : freePans(st);
            const pref = (PICK_PREF[st.map] || []).filter((k) => free.includes(k));
            return pref.length && ctx.random() < 0.7 ? pref[0] : ctx.shuffle(free)[0];
        }
        function startDraft(st, ctx) {
            if (st.phase !== 'setup') return;
            ctx.cancel('setup');
            const nAi = Math.max(0, Math.min(st.aiN, 8 - st.order.length));
            for (let i = 1; i <= nAi; i++) { const id = 'ai' + i; st.pl[id] = newPlayer(id, `AI ${i}`, true); st.order.push(id); }
            const rolls = {}, tie = {};
            for (const id of st.order) { rolls[id] = [1 + Math.floor(ctx.random() * 6), 1 + Math.floor(ctx.random() * 6)]; tie[id] = ctx.random(); }
            const ord = [...st.order].sort((a, b) => rolls[b][0] + rolls[b][1] - rolls[a][0] - rolls[a][1] || tie[b] - tie[a]);
            st.draft = { ord, rolls, step: 0, kind: 'L', ends: null, seq: 0 };
            log(st, `🎲 The dice set the draft order: ${ord.map((id) => `${st.pl[id].nm} (${rolls[id][0] + rolls[id][1]})`).join(', ')}.`, 'fun');
            ctx.goto('draft');
            draftNext(st, ctx);
        }
        function draftNext(st, ctx) {
            const D = st.draft;
            D.seq++;
            ctx.cancel('draft');
            if (D.step >= D.ord.length) {
                if (D.kind === 'L') { D.kind = 'P'; D.ord = [...D.ord].reverse(); D.step = 0; }
                else { startGame(st, ctx); return; }
            }
            const cur = D.ord[D.step], P = st.pl[cur], on = ctx.players.some((p) => p.id === cur && p.connected);
            if (!P || P.ai || !on) { D.ends = null; ctx.after(P?.ai ? 650 : 300, 'draftAuto', { seq: D.seq }, { key: 'draft' }); }
            else if (ctx.mode !== 'solo') { D.ends = ctx.now + 30000; ctx.after(30000, 'draftAuto', { seq: D.seq }, { key: 'draft' }); }
            else D.ends = null;
        }
        function draftApply(st, ctx, pid, k) {
            const D = st.draft, P = st.pl[pid];
            if (!P) return false;
            if (D.kind === 'L') {
                if (!LEADERS[k] || !freeLeaders(st).includes(k)) return false;
                P.leader = k;
                if (P.ai) P.nm = `${LEADERS[k].n} (AI)`;
            } else {
                if (!PAN[k] || !freePans(st).includes(k)) return false;
                P.pan = k; P.col = PAN[k].col;
            }
            D.step++;
            draftNext(st, ctx);
            return true;
        }
        function startGame(st, ctx) {
            ctx.cancel('draft');
            for (const id of st.order) {
                const p = st.pl[id];
                if (!p.leader) p.leader = ctx.shuffle(freeLeaders(st))[0] || 'augustus';
                if (!p.pan) p.pan = ctx.shuffle(freePans(st))[0] || 'olymp';
                p.col = PAN[p.pan].col;
                if (p.ai) p.nm = `${LEADERS[p.leader].n} (AI)`;
                p.age = MAPS[st.map].start;
                p.gold = (MAPS[st.map].start ? 200 : 80) + (st.fast ? 40 : 0);
            }
            genWorld(st, ctx);
            ctx.goto('turn');
        }

        const game = defineGame({
            root: document.getElementById('app'),
            tickMs: 500,

            initialState(ctx) {
                const s = ctx.settings || {}, fast = s.speed === 'fast', turns = clampN(+s.turns || 70, 20, 120);
                const st = {
                    v: 0, turn: 0, map: MAPS[s.map] ? s.map : 'classic', diff: DIFFS[s.difficulty] ?? 1, fast, baseT: turns,
                    maxT: fast ? clampN(Math.round(turns * 0.45), 20, 45) : turns,
                    tt: ctx.mode === 'solo' ? 0 : Math.round(clampN(+s.turnTime || 90, 20, 300) * (fast ? 0.7 : 1)),
                    aiN: ctx.mode === 'solo' ? clampN(+(s.aiRivals ?? 2), 0, 5) : clampN(+(s.aiRivalsMp ?? 0), 0, 4),
                    pl: {}, order: [], ter: '', road: '', feat: {}, sec: {}, dist: {}, site: {}, cities: [], units: [], tem: [], won: {}, mom: {},
                    log: [], goal: {}, dip: { al: [], pa: [], pr: [] }, draft: null, nid: 1, spare: [], under: null, heg: null, over: false,
                    final: null, win: null, sale: 0, setupEnds: null, turnEnds: null, hist: [], emo: [],
                };
                for (const p of ctx.players) addHuman(st, p);
                ctx.goto('setup');
                if (ctx.mode !== 'solo') {
                    st.setupEnds = ctx.now + 120000;
                    ctx.after(120000, 'setupTimeout', {}, { key: 'setup' });
                }
                return st;
            },

            phases: {
                setup: { actions: ['setOpt', 'start'] },
                draft: { actions: ['draftPick', 'draftAuto'] },
                turn: {
                    actions: ['move', 'attack', 'travel', 'buy', 'build', 'found', 'convert', 'disband', 'research', 'policy', 'belief', 'wonder', 'walls', 'sack', 'dip', 'cyber', 'favor', 'endTurn', 'timeUp', 'forceEnd'],
                    onEnter(st, ctx) {
                        st.turn++;
                        for (const id of st.order) {
                            const P = st.pl[id];
                            P.done = false;
                            if (!P.ai && !P.res && !P.dead && !P.spec) P.res = autoTech(st, P, techAvail(st, P));
                        }
                        for (const u of st.units) { u.mv = uStats(st, u).mv; u.at = 0; }
                        const M = MAPS[st.map];
                        if (st.turn === 1) log(st, `🌅 ${M.e} ${M.n}: the world awakens. Sid Meier's ghost whispers: “just one more turn…”`, 'fun');
                        if (st.turn === peaceT(st) && !coop(st)) log(st, '⚔️ The early peace is over: empires may now attack each other and city-states.', 'war');
                        if (st.turn === st.maxT) log(st, '⌛ This is the final turn of history!', 'mom');
                        if (st.tt) {
                            st.turnEnds = ctx.now + st.tt * 1000;
                            ctx.after(st.tt * 1000, 'timeUp', { turn: st.turn }, { key: 'turn' });
                        } else st.turnEnds = null;
                        st.v++;
                    },
                },
                events: {
                    actions: ['skipNews'],
                    seconds: (st, ctx) => (ctx.mode === 'solo' ? 2.2 : 3.5),
                    onEnter(st, ctx) { ctx.cancel('turn'); processTurn(st, ctx); st.v++; },
                    onTimeout(st, ctx) { ctx.goto(st.over ? 'end' : 'turn'); },
                },
                end: {
                    onEnter(st, ctx) {
                        finalize(st);
                        const scores = {};
                        for (const r of st.final) if (!st.pl[r.id].ai) scores[r.id] = r.score;
                        st.v++;
                        ctx.end({ scores });
                    },
                },
            },

            actions: {
                /* ----- lobby & draft ----- */
                setOpt: A((st, pl, ctx) => {
                    if (!(ctx.fromHost || ctx.mode === 'solo') || st.phase !== 'setup') return;
                    if (MAPS[pl.map]) st.map = pl.map;
                    if (pl.diff in DIFFS) st.diff = DIFFS[pl.diff];
                    if (Number.isInteger(pl.ai)) st.aiN = clampN(pl.ai, 0, 5);
                    if (typeof pl.fast === 'boolean') { st.fast = pl.fast; st.maxT = st.fast ? clampN(Math.round(st.baseT * 0.45), 20, 45) : st.baseT; }
                }),
                start: A((st, pl, ctx) => { if ((ctx.fromHost || ctx.mode === 'solo') && st.phase === 'setup') startDraft(st, ctx); }),
                setupTimeout: A((st, pl, ctx) => { if (ctx.fromHost && st.phase === 'setup') startDraft(st, ctx); }),
                draftPick: A((st, pl, ctx) => {
                    const D = st.draft;
                    if (st.phase !== 'draft' || !D || !ctx.playerId || D.ord[D.step] !== ctx.playerId || typeof pl.k !== 'string') return;
                    if (st.pl[ctx.playerId]?.ai) return;
                    draftApply(st, ctx, ctx.playerId, pl.k);
                }),
                draftAuto: A((st, pl, ctx) => {
                    const D = st.draft;
                    if (!ctx.fromHost || st.phase !== 'draft' || !D || pl.seq !== D.seq) return;
                    const cur = D.ord[D.step];
                    draftApply(st, ctx, cur, aiDraftChoice(st, ctx, D.kind));
                }),

                /* ----- turn ----- */
                move: PA((st, pl, ctx, P) => {
                    const u = myUnit(st, P, pl.u);
                    if (!u || !Number.isInteger(pl.to)) return;
                    const idx = index(st), r = reachable(st, u, idx, true);
                    if (!r.best.has(pl.to)) return;
                    const S = uStats(st, u), zoc = S.fly || isCiv(u) ? null : zocMap(st, u, idx);
                    const capt = !isCiv(u) && idx.civ[pl.to] && idx.civ[pl.to].o !== u.o;
                    u.mv = Math.max(0, u.mv - r.best.get(pl.to)); u.fo = 0;
                    for (let x = r.prev.get(pl.to); x !== undefined && x !== u.x; x = r.prev.get(x)) reveal(st, P, x, 2);
                    moveInto(st, ctx, u, pl.to);
                    if ((zoc && zoc[pl.to]) || capt) u.mv = 0;
                }),
                attack: PA((st, pl, ctx, P) => {
                    const u = myUnit(st, P, pl.u);
                    if (!u || !Number.isInteger(pl.to) || !targets(st, u).includes(pl.to)) return;
                    attack(st, ctx, u, pl.to);
                }),
                travel: PA((st, pl, ctx, P) => { if (Number.isInteger(pl.to)) travel(st, ctx, P, myUnit(st, P, pl.u), pl.to); }),
                buy: PA((st, pl, ctx, P) => { if ([...RECRUIT, ...FAITH_BUY].includes(pl.t)) buyUnit(st, P, myCity(st, P, pl.c), pl.t); }),
                build: PA((st, pl, ctx, P) => { if (['dist', 'holy', 'fort', 'road', 'forge'].includes(pl.k)) builderAct(st, P, myUnit(st, P, pl.u), pl.k); }),
                found: PA((st, pl, ctx, P) => { foundCity(st, ctx, P, myUnit(st, P, pl.u)); }),
                convert: PA((st, pl, ctx, P) => { convertAct(st, P, myUnit(st, P, pl.u)); }),
                disband: PA((st, pl, ctx, P) => {
                    const u = myUnit(st, P, pl.u);
                    if (!u || u.t === 'H') return;
                    if (u.relic) st.feat[u.x] = 'ring';
                    if (u.hr && !st.feat[u.x]) st.feat[u.x] = 'relic';
                    st.units.splice(st.units.indexOf(u), 1);
                }),
                research: PA((st, pl, ctx, P) => {
                    if (typeof pl.k !== 'string' || !techAvail(st, P).includes(pl.k)) return;
                    P.res = pl.k;
                    researchTick(st, ctx, P);
                }),
                policy: PA((st, pl, ctx, P) => { adoptPolicy(st, P, pl.k); }),
                belief: PA((st, pl, ctx, P) => { adoptBelief(st, P, pl.k); }),
                wonder: PA((st, pl, ctx, P) => { buildWonder(st, P, pl.w); }),
                walls: PA((st, pl, ctx, P) => { buildWalls(st, P, myCity(st, P, pl.c)); }),
                sack: PA((st, pl, ctx, P) => { sackCS(st, ctx, P, st.cities.find((c) => c.i === pl.c)); }),
                dip: PA((st, pl, ctx, P) => { if (typeof pl.to === 'string' && ['pa', 'al', 'break', 'gift'].includes(pl.k)) diplo(st, ctx, P, pl.to, pl.k); }),
                cyber: PA((st, pl, ctx, P) => { if (typeof pl.to === 'string') cyber(st, ctx, P, pl.to); }),
                favor: PA((st, pl, ctx, P) => { if (['tribute', 'griffin', 'forge', 'bless'].includes(pl.k)) favorAct(st, P, pl.k); }),
                endTurn: PA((st, pl, ctx, P) => { P.done = !P.done; allDone(st, ctx); }),
                timeUp: A((st, pl, ctx) => { if (ctx.fromHost && st.phase === 'turn' && pl.turn === st.turn) ctx.goto('events'); }),
                forceEnd: A((st, pl, ctx) => { if (ctx.fromHost && st.phase === 'turn') ctx.goto('events'); }),
                emote: A((st, pl, ctx) => {
                    const P = ctx.playerId && st.pl[ctx.playerId];
                    if (!P || !EMOTES.includes(pl.e) || ctx.now - (P.em || 0) < 2500) return;
                    P.em = ctx.now;
                    st.emo = [...(st.emo || []), { id: P.id, e: pl.e, t: ctx.now }].slice(-6);
                }),
                skipNews: A((st, pl, ctx) => { if ((ctx.fromHost || ctx.mode === 'solo') && st.phase === 'events') ctx.goto(st.over ? 'end' : 'turn'); }),
            },

            // Fog of war: each device only gets the units it can see, its own explored map,
            // and nobody gets the hidden treasures and curses.
            playerView(st, pid) {
                if (!st.pl) return st;
                const v = { ...st, sec: {} };
                if (st.phase === 'setup' || st.phase === 'draft' || st.phase === 'end') return v;
                const pl = {};
                for (const [id, p] of Object.entries(st.pl)) pl[id] = id === pid ? p : { ...p, fog: null, hits: [], mark: null };
                v.pl = pl;
                v.log = st.log.filter((l) => !l.to || l.to === pid);
                v.dip = { ...st.dip, pr: st.dip.pr.filter((p) => p.a === pid || p.b === pid) };
                const me = pid && st.pl[pid];
                if (me && me.fog && !me.spec && !me.dead) {
                    const vis = visibleSet(st, pid, terr(st));
                    v.units = st.units.filter((u) => u.o === pid || vis[u.x]);
                }
                return v;
            },

            playerJoined(st, player, ctx) {
                if (st.pl[player.id]) return;
                if (!st.phase || st.phase === 'setup') { addHuman(st, player); return; }
                if (st.phase === 'draft') {
                    addHuman(st, player);
                    if (st.draft.kind === 'L') { st.draft.ord.push(player.id); st.draft.rolls[player.id] = [1, 1]; }
                    st.v++;
                    return;
                }
                if (st.phase === 'end') return;
                const P = newPlayer(player.id, player.name || 'Player', false);
                st.pl[player.id] = P;
                const si = st.spare.findIndex((x) => !st.units.some((u) => u.x === x) && st.cities.every((c) => dist(c.x, x) >= 4));
                const fp = freePans(st), fl = freeLeaders(st);
                if (si < 0 || !fp.length || !fl.length) { P.spec = true; st.v++; return; }
                P.pan = ctx.shuffle(fp)[0]; P.leader = ctx.shuffle(fl)[0];
                P.col = PAN[P.pan].col; P.age = MAPS[st.map].start; P.ready = true;
                P.gold = 100 + st.turn * 10;
                for (let i = 0; i < Math.min(st.turn >> 2, 8); i++) { const av = techAvail(st, P); if (!av.length) break; P.tech.push(av[0]); }
                P.age = ageFor(st, P);
                st.order.push(P.id);
                foundEmpire(st, ctx, P.id, st.spare.splice(si, 1)[0]);
                for (const u of st.units) if (u.o === P.id) u.mv = uStats(st, u).mv;
                P.res = autoTech(st, P, techAvail(st, P));
                log(st, `🎺 ${P.nm} (${LEADERS[P.leader].n}) joins the world late. Welcome!`, 'good');
                st.v++;
            },
            playerLeft(st, player, ctx) { allDone(st, ctx); st.v++; },

            renderWaiting(ui) {
                return ui.html`<div class="app"><div class="card hero"><div class="big">⬡</div><h1>Hexagon Empires</h1>
      <p>Roll for the draft, pick a leader and a pantheon, research, expand, conquer — or win your campaign’s own way.</p>
      <p class="quote">${WAIT_Q}</p><p class="mut">Waiting for the game to start…</p></div></div>`;
            },

            render(st, ui) {
                G.ui = ui; G.st = st;
                if (!st || !st.pl) return ui.html`<div class="app"><div class="card hero"><div class="big">⬡</div><h1>Hexagon Empires</h1></div></div>`;
                if (st.phase === 'setup') return renderSetup(st, ui);
                if (st.phase === 'draft') return renderDraft(st, ui);
                if (st.phase === 'end') return renderEnd(st, ui);
                return renderGame(st, ui);
            },

            afterRender(st, ui) {
                G.ui = ui; G.st = st;
                if (!st || !st.ter || st.phase === 'setup' || st.phase === 'draft' || st.phase === 'end') { dispose3d(); }
                else updateMap(st, ui);
                // personal news (ruins, treasures, curses) and big moments pop up as a toast
                const meId = ui.self?.id, last = st.log?.[st.log.length - 1];
                const lk = last ? `${last.t}|${last.m}` : '';
                if (lk !== G.lastLog) {
                    const fresh = G.lastLog !== '';
                    G.lastLog = lk;
                    if (fresh && last && (last.to === meId || last.k === 'mom') && st.phase === 'turn') showToast(ui, last.m);
                }
                if (st.phase === 'end' && ui.self && st.final && !G.saved) {
                    G.saved = true;
                    const mine = st.final.find((r) => r.id === ui.self.id);
                    if (mine) {
                        const s = ui.saved?.plugin || {};
                        const won = coop(st) ? st.win?.id === 'all' : st.win?.id === ui.self.id;
                        const got = earnedAch(st, ui.self.id), had = s.ach || [];
                        G.newAch = got.filter((k) => !had.includes(k));
                        ui.save('plugin', { ...s, games: (s.games || 0) + 1, wins: (s.wins || 0) + (won ? 1 : 0), ach: [...new Set([...had, ...got])] });
                        if (G.newAch.length) ui.setLocal({ achAt: Date.now() });
                    }
                }
            },
        });
        void game;
    </script>
</body>

</html>
