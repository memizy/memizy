function answerText(item, ui) {
  const inline = (s) => ui.text(String(s ?? ''), { inline: true, item });
  switch (item.type) {
    case 'mcq-single': return inline(item.options[item.correctIndex]);
    case 'true-false': return item.correctAnswer ? L.truth : L.lie;
    case 'mcq-multi': return item.correctIndices.map((i) => inline(item.options[i])).join(', ');
    case 'short-answer': return esc(item.correctAnswers.slice(0, 3).join(' / '));
    case 'sort-items': return item.items.map(inline).join(' → ');
    case 'match-pairs': return item.prompts.map((p, i) => `${inline(p)} = ${inline(item.matches[i])}`).join('; ');
    default: return '';
  }
}

function quizControls(item, seq, ui, sent) {
  const inline = (s) => ui.text(String(s ?? ''), { inline: true, item });
  const hidden = `<input type="hidden" name="seq" value="${seq}">`;
  const submit = sent ? `<div class="sent">${L.sent}</div>` : `<button class="qsub" type="submit">${L.submit}</button>`;
  const chosen = (answer) => (sent && sent.answer === answer ? ' chosen' : '');
  const off = sent ? 'disabled' : '';
  switch (item.type) {
    case 'mcq-single':
      return `<div class="qgrid">${item.options.map((o, i) => `<button class="qbtn${chosen(i)}" ${off} data-act="submit_answer" data-payload='{"seq":${seq},"answer":${i}}'>${inline(o)}</button>`).join('')}</div>${sent ? `<div class="sent">${L.sent}</div>` : ''}`;
    case 'true-false':
      return `<div class="qgrid"><button class="qbtn${chosen(true)}" ${off} data-act="submit_answer" data-payload='{"seq":${seq},"answer":true}'>${L.truth}</button><button class="qbtn${chosen(false)}" ${off} data-act="submit_answer" data-payload='{"seq":${seq},"answer":false}'>${L.lie}</button></div>${sent ? `<div class="sent">${L.sent}</div>` : ''}`;
    case 'mcq-multi':
      return `<form class="qform" data-act="submit_answer">${hidden}${item.options.map((o, i) => `<label class="qcheck"><input type="checkbox" name="sel" value="${i}"><span>${inline(o)}</span></label>`).join('')}${submit}</form>`;
    case 'short-answer':
      return `<form class="qform" data-act="submit_answer">${hidden}<input class="qinput" name="text" autocomplete="off" placeholder="${L.yourAnswer}">${submit}</form>`;
    case 'sort-items': {
      const shuffled = stableShuffle(item.items, seq);
      return `<form class="qform" data-act="submit_answer">${hidden}${item.items.map((_, pos) => `<div class="qpair"><b style="color:var(--gold-bright)">${pos + 1}.</b>
        <select class="qsel" name="o${pos}">${shuffled.map(({ v, i }) => `<option value="${i}">${esc(String(v).replace(/[*_`$]/g, ''))}</option>`).join('')}</select></div>`).join('')}${submit}</form>`;
    }
    case 'match-pairs': {
      const shuffled = stableShuffle(item.matches, seq);
      return `<form class="qform" data-act="submit_answer">${hidden}${item.prompts.map((p, pi) => `<div class="qpair"><div>${inline(p)}</div>
        <select class="qsel" name="p${pi}">${shuffled.map(({ v, i }) => `<option value="${i}">${esc(String(v).replace(/[*_`$]/g, ''))}</option>`).join('')}</select></div>`).join('')}${submit}</form>`;
    }
    default: return '';
  }
}

/** What the player answered, as text (review screen). */
function givenText(item, given, ui) {
  if (given === null || given === undefined) return '—';
  const inline = (s) => ui.text(String(s ?? ''), { inline: true, item });
  switch (item.type) {
    case 'mcq-single': return inline(item.options[given]);
    case 'true-false': return given ? L.truth : L.lie;
    case 'mcq-multi': return given.length ? given.map((i) => inline(item.options[i])).join(', ') : '—';
    case 'short-answer': return esc(given || '—');
    case 'sort-items': return given.map((i) => inline(item.items[i])).join(' → ');
    case 'match-pairs': return item.prompts.map((p, i) => `${inline(p)} = ${inline(item.matches[given[i]])}`).join('; ');
    default: return '—';
  }
}

/** Options with the correct ones and the player's choice marked (choice questions). */
function reviewOptions(item, given, ui) {
  const inline = (s) => ui.text(String(s ?? ''), { inline: true, item });
  let options, correct, chosen;
  if (item.type === 'true-false') {
    options = [L.truth, L.lie];
    correct = [item.correctAnswer ? 0 : 1];
    chosen = given === null || given === undefined ? [] : [given ? 0 : 1];
    return options.map((o, i) => reviewRow(o, correct.includes(i), chosen.includes(i))).join('');
  }
  options = item.options.map(inline);
  correct = item.type === 'mcq-single' ? [item.correctIndex] : item.correctIndices;
  chosen = given === null || given === undefined ? [] : [].concat(given);
  return options.map((o, i) => reviewRow(o, correct.includes(i), chosen.includes(i))).join('');
}
const reviewRow = (html, isCorrect, isChosen) =>
  `<div class="rv-row${isCorrect ? ' rv-ok' : isChosen ? ' rv-bad' : ''}"><span>${isCorrect ? '✅' : isChosen ? '❌' : '▫️'}</span><span>${html}</span></div>`;

function renderQuiz(state, ui, me) {
  const pending = state.pending[me];
  const fb = G.feedback;
  const reviewLeft = (state.stunnedUntil[me] ?? 0) - ui.now();
  const showFb = fb && !fb.correct && reviewLeft > 0;
  const itemId = pending?.itemId ?? (showFb ? fb.itemId : null);
  if (!itemId) return '';
  const item = ui.item(itemId);
  if (!item) return '';
  const crate = pending?.crate ?? fb?.crate;
  const tag = crate === 'ammo' ? L.quizAmmo : L.quizMaterial;
  if (pending) {
    const left = ui.timeLeft(pending.deadline);
    const frac = clamp(left / (state.timerSec * 1000), 0, 1);
    return `<div class="quiz" data-key="quiz"><div class="quiz-inner">
      <div class="quiz-tag"><span>${tag}</span><span>${Math.ceil(left / 1000)} s</span></div>
      <div class="quiz-timer"><div style="width:${frac * 100}%;background:${frac > 0.5 ? 'var(--gold)' : frac > 0.25 ? '#e8974a' : 'var(--danger)'}"></div></div>
      <div class="quiz-q">${ui.text(item.question ?? '', { item })}</div>
      ${quizControls(item, pending.seq, ui, ui.pending.find((a) => a.name === 'submit_answer' && Number(a.payload?.seq) === pending.seq)?.payload)}
    </div></div>`;
  }
  // Wrong or too late: time to look at the correct answer (the player cannot act meanwhile).
  const choice = item.type === 'mcq-single' || item.type === 'mcq-multi' || item.type === 'true-false';
  const total = REVIEW_MS;
  return `<div class="quiz review" data-key="quiz"><div class="quiz-inner">
    <div class="quiz-tag"><span>${tag}</span><span>${L.review}</span></div>
    <div class="feedback fb-wrong">${fb.timedOut ? L.timeUp(fb.dmg) : L.wrong(fb.dmg)}</div>
    <div class="quiz-q">${ui.text(item.question ?? '', { item })}</div>
    ${choice ? `<div class="rv-list">${reviewOptions(item, fb.given, ui)}</div>`
      : `<div class="rv-text"><b>${L.yourWas}</b> ${givenText(item, fb.given, ui)}</div><div class="rv-text rv-ok"><b>${L.correctWas}</b> ${answerText(item, ui)}</div>`}
    ${item.explanation ? `<div class="rv-expl">${ui.text(item.explanation, { item })}</div>` : ''}
    <div class="rv-wait"><div style="width:${clamp(reviewLeft / total, 0, 1) * 100}%"></div></div>
    <div class="muted">${L.continueIn(Math.ceil(reviewLeft / 1000))}</div>
  </div></div>`;
}

function hintText(state, me, ui) {
  if (G.walking) return L.hintRun;
  if (ui?.isPending('request_question')) return L.hintQuestion;
  const inv = state.inventory[me];
  if (inv === 'ball') return L.hintBall;
  if (inv === 'plank') return state.hits[G.team]?.length ? L.hintPlank : L.hintPlankNone;
  return L.hintEmpty;
}

/* ---- 2D deck: the same running time as in 3D, animated shots ---- */
const DECK_X = { ammo: 14, cannon: 50, material: 86, hull: 50 };

function shotAnim2d() {
  const a = G.anim2d;
  if (!a) return '';
  const t = performance.now() - a.start;
  if (t < 1100) return `<span class="ball2d ${a.outgoing ? 'out' : 'in'}" data-key="ball${a.seq}">●</span>`;
  if (t < 2000) return `<span class="boom2d ${a.outgoing ? 'at-foe' : 'at-own'}" data-key="boom${a.seq}">${a.label === 'miss' ? '🌊' : '💥'}</span>`;
  return '';
}

function renderDeck2d(state, ui, me) {
  const inv = state.inventory[me] ?? null;
  const team = G.team, foe = otherTeam(team);
  const breaches = state.hits[team] ?? [];
  const busy = !!state.pending[me] || G.walking || !!state.aiming[me];
  const shaking = G.shake2d && G.shake2d.until > performance.now();
  return `<div class="deck2d" data-key="deck2d">
    <div class="ships2d">
      <span class="ship2d own${shaking ? ' shake' : ''}">${TEAMS[team].flag}<br>⛵</span>
      ${shotAnim2d()}
      <span class="vs">VS</span>
      <span class="ship2d foe">${state.ai === foe ? '☠️' : TEAMS[foe].flag}<br>⛵</span>
    </div>
    <div class="deckbar">
      <span class="deck-spot" style="left:${DECK_X.ammo}%">🧨</span>
      <span class="deck-spot" style="left:${DECK_X.cannon}%">💣</span>
      <span class="deck-spot" style="left:${DECK_X.material}%">🪵</span>
      <span class="sailor" data-key="sailor" style="left:${G.sailor2d ?? 50}%">${G.walking ? '🏃' : '🧍'}${inv === 'ball' ? '⚫' : inv === 'plank' ? '🟫' : ''}</span>
    </div>
    <button class="station${inv !== 'ball' ? ' ok' : ''}" data-local="go2d" data-to="ammo" ${inv === 'ball' || busy ? 'disabled' : ''}>
      <span class="ico">🧨</span><span>${L.magazine.replace('🧨 ', '')}<small>${L.magazineSub}</small></span></button>
    <button class="station${inv !== 'plank' ? ' ok' : ''}" data-local="go2d" data-to="material" ${inv === 'plank' || busy ? 'disabled' : ''}>
      <span class="ico">🪵</span><span>${L.carpenter.replace('🪵 ', '')}<small>${L.carpenterSub}</small></span></button>
    <button class="station${inv === 'ball' ? ' ok' : ''}" data-local="go2d" data-to="cannon" ${inv !== 'ball' || busy ? 'disabled' : ''}>
      <span class="ico">💣</span><span>${L.fire.replace('💣 ', '')}<small>${L.fireSub}</small></span></button>
    <div class="muted" style="text-align:left">${L.breaches}</div>
    <div class="breaches">${breaches.length ? breaches.map((h, i) => `<button class="breach" data-local="go2d" data-to="hull" data-hit="${h.id}" ${inv !== 'plank' || busy ? 'disabled' : ''}>${L.repair} #${i + 1}${h.sev === 'crit' ? ' 🔥' : ''} <small>(${h.left ?? 100})</small></button>`).join('') : `<span class="muted">${L.noBreaches}</span>`}</div>
  </div>`;
}

/** Runs the sailor to a station (same time as in 3D), then does the action. */
function go2d(to, hitId) {
  const state = G.state, me = G.me;
  if (!state || state.phase !== 'battle' || G.walking) return;
  if ((state.stunnedUntil[me] ?? 0) > G.ui.now()) return floatMsg(L.msgStunned, '#f0c96c');
  const act = () => {
    if (to === 'ammo') game.act('request_question', { crate: 'ammo' });
    else if (to === 'material') game.act('request_question', { crate: 'material' });
    else if (to === 'cannon') game.act('aim', { cannon: 1 });
    else if (to === 'hull') game.act('repair', { hitId });
  };
  const x = DECK_X[to];
  if (G.sailor2d === x) return act();
  G.sailor2d = x;
  G.walking = true;
  setTimeout(() => { G.walking = false; act(); }, WALK_MS);
}

function renderAim(state, ui, aim) {
  const left = ui.timeLeft(aim.start + AIM_MS);
  const head = `<div class="aim-head"><span>${L.aimTitle}</span><span>${Math.ceil(left / 1000)} s</span></div>
    <div class="aim-track"><div style="width:${clamp(left / AIM_MS, 0, 1) * 100}%"></div></div>`;
  if (!G.mode2d) return `<div class="aim" data-key="aim" data-local="fire">${head}<div class="aim-mid"><div class="reticle"></div></div><div class="aim-hint">${L.aimHint}</div></div>`;
  // 2D: the enemy ship in the middle, the sight sways with exactly the same motion as the 3D barrel.
  return `<div class="aim aim-2d" data-key="aim" data-local="fire">${head}
    <div class="aim-mid" id="aim2d" data-keep>
      <div class="aim-sea"></div>
      <div class="aim-foe">${state.ai === otherTeam(G.team) ? '☠️' : TEAMS[otherTeam(G.team)].flag}<br>⛵</div>
      <div class="aim-ring"></div>
      <div class="reticle2d"></div>
    </div>
    <div class="aim-hint">${L.aimHint}</div></div>`;
}

function renderBattle(state, ui) {
  const me = ui.self?.id;
  const team = G.team;
  const foe = otherTeam(team);
  const own = state.ships[team], enemy = state.ships[foe];
  const inv = state.inventory[me] ?? null;
  const reviewLeft = (state.stunnedUntil[me] ?? 0) - ui.now();
  const streak = state.streaks[me] ?? 0;
  const aim = state.aiming[me];
  const showFloat = G.float && G.float.until > performance.now();
  const finishedBanner = state.phase === 'finished' ? resultBanner(state, me) : '';
  const quiz = renderQuiz(state, ui, me);
  return `<div class="game">
    ${G.mode2d ? renderDeck2d(state, ui, me) : '<div id="sea" data-keep></div>'}
    <div class="hud-top" data-key="hud-top">
      <div class="hp-row"><span class="hp-label">${TEAMS[team].flag} ${Math.round(pct(own))}%${powerOf(state, team) > 1 ? `<span class="power" title="${L.strengthHint}">${L.strength(roundPower(powerOf(state, team)))}</span>` : ''}</span><div class="hp-track"><div class="hp-fill" style="width:${pct(own)}%;background:linear-gradient(90deg,#1d7a4f,var(--green))"></div></div></div>
      <div class="hp-row"><span class="hp-label">${state.ai === foe ? '☠️' : TEAMS[foe].flag} ${Math.round(pct(enemy))}%</span><div class="hp-track"><div class="hp-fill" style="width:${pct(enemy)}%;background:linear-gradient(90deg,#8c1823,var(--danger))"></div></div></div>
      <div class="hud-row"><span class="hud-timer">⏳ ${fmtTime(ui.timeLeft(state.battleEndsAt))}</span><span class="hud-score">🏆 ${state.scores[me] ?? 0}</span>
        <span class="hud-inv">${inv === 'ball' ? L.ball : inv === 'plank' ? `${L.plank} · ${Math.round(repairEfficiency(state, team) * 100)} %` : L.empty}</span></div>
    </div>
    <div class="hud-bot" data-key="hud-bot">
      <span class="hint">${hintText(state, me, ui)}</span>
      <span class="streak">${streak >= 2 ? L.streak(streak) : ''}</span>
      <button class="mode-btn" data-local="toggle2d" title="${esc(G.reason2d ?? '')}">${G.mode2d ? L.to3d : L.to2d}</button>
    </div>
    ${reviewLeft > 0 && !quiz ? `<div class="wait-banner" data-key="wait">${L.waitReview(Math.ceil(reviewLeft / 1000))}</div>` : ''}
    ${showFloat ? `<div class="float" data-key="float" style="color:${G.float.color}">${esc(G.float.text)}</div>` : ''}
    ${quiz}
    ${aim && state.phase === 'battle' && !ui.isPending('fire') ? renderAim(state, ui, aim) : ''}
    ${finishedBanner}
  </div>`;
}

function resultBanner(state, me) {
  const mine = teamOf(state, me), w = state.winner;
  let text;
  if (!w || w === 'draw') text = `🤝 ${L.draw}`;
  else if (w === mine) text = `🏆 ${state.reason === 'sunk' ? L.winSunk : L.winTime}`;
  else text = `💀 ${state.reason === 'sunk' ? L.loseSunk : L.loseTime}`;
  return `<div class="result-banner" data-key="result"><div>${text}</div></div>`;
}

function renderPlayerFinished(state, ui) {
  const me = ui.self?.id, mine = teamOf(state, me), w = state.winner;
  const won = w && w !== 'draw' && w === mine;
  return `<section class="screen"><div class="panel" style="max-width:440px">
    <div class="big-emoji">${!w || w === 'draw' ? '🤝' : won ? '🏆' : '💀'}</div>
    <div class="panel-title">${!w || w === 'draw' ? L.drawTitle : won ? L.victory : L.defeat}</div>
    <div class="panel-sub">${w && w !== 'draw' ? L.rule(crewName(state, w), crewPlural(state, w)) : L.bothLive}</div>
    <div style="text-align:center;font-size:14px;color:var(--gold-bright);margin:6px 0 14px;font-weight:800">${L.myScore(state.scores[me] ?? 0)}</div>
    ${state.solo ? '' : leaderboardHtml(state, ui)}
  </div></section>`;
}

function render(state, ui) {
  setLang(ui.locale);
  G.state = state;
  G.ui = ui;
  if (ui.view === 'board') {
    if (state.phase === 'teams') return renderBoardLobby(state, ui);
    if (state.phase === 'battle') return renderBoardBattle(state, ui);
    return renderBoardFinished(state, ui);
  }
  const me = ui.self?.id;
  G.me = me;
  if (state.phase === 'teams') return renderTeamSelect(state, ui);
  G.team = teamOf(state, me);
  if (!G.team) return `<section class="screen"><div style="font-size:64px">🦜</div><div class="panel-title" style="font-size:20px">${L.notInCrew}</div></section>`;
  if (state.phase === 'finished') {
    G.finishedAt ??= performance.now();
    if (performance.now() - G.finishedAt > 4500) return renderPlayerFinished(state, ui);
  }
  return renderBattle(state, ui);
}

/* ═════════════════════════════════════════════════════════
   afterRender(): reacts to state changes on the device (3D, messages)
   ═════════════════════════════════════════════════════════ */
function afterRender(state, ui) {
  if (ui.view === 'board' || state.phase === 'teams' || !G.team) return;
  const me = ui.self?.id;
  const shot = state.lastShot;
  const notice = state.notice[me];
  const result = state.result[me];
  if (!G.seen) G.seen = { shot: shot?.seq ?? 0, notice: notice?.seq ?? 0, result: result?.seq ?? 0 }; // no replay after (re)joining

  if (notice && notice.seq !== G.seen.notice) {
    G.seen.notice = notice.seq;
    const map = { hands: L.msgHands, noQuestions: L.msgNoQ, stunned: L.msgStunned, patched: L.msgPatched, needBall: L.msgNeedBall, needPlank: L.msgNeedPlank };
    if (map[notice.type]) floatMsg(map[notice.type], '#f0c96c');
  }
  if (result && result.seq !== G.seen.result) {
    G.seen.result = result.seq;
    if (result.correct) {
      G.feedback = null;
      floatMsg(result.crate === 'ammo' ? L.correctAmmo : L.correctPlank, '#2ec27e', 2400);
    } else {
      G.feedback = { ...result };
    }
  }
  const selfHit = state.selfHit;
  if (G.seen.self === undefined) G.seen.self = selfHit?.seq ?? 0;
  if (selfHit && selfHit.seq !== G.seen.self) {
    G.seen.self = selfHit.seq;
    if (selfHit.team === G.team) {
      if (selfHit.by !== me) floatMsg(L.msgSelf(selfHit.dmg), '#ef476f');
      if (Scene.ready) Scene.selfHit();
      G.shake2d = { until: performance.now() + 800 };
    }
  }
  if (shot && shot.seq !== G.seen.shot) {
    G.seen.shot = shot.seq;
    const outgoing = shot.from === G.team;
    const message = () => {
      if (shot.label === 'miss') { if (outgoing) floatMsg(L.msgSplash, '#9fd3e8'); }
      else if (outgoing) floatMsg(shot.label === 'crit' ? L.msgCrit(shot.dmg) : L.msgHit(shot.dmg), shot.label === 'crit' ? '#f0c96c' : '#2ec27e');
      else floatMsg(L.msgWeHit(shot.dmg), '#ef476f');
    };
    if (Scene.ready) Scene.shot(shot, outgoing, message);
    else {
      G.anim2d = { seq: shot.seq, outgoing, label: shot.label, start: performance.now() };
      setTimeout(message, 1100);
      if (!outgoing && shot.dmg > 0) setTimeout(() => (G.shake2d = { until: performance.now() + 800 }), 1100);
    }
  }
  if (G.mode2d && state.aiming[me] && state.phase === 'battle') aim2dLoop();

  if (!G.mode2d) {
    if (!Scene.state) void Scene.init(G.team);
    if (Scene.ready) Scene.sync(state, me);
  }
}

/* ═════════════════════════════════════════════════════════
   The 3D scene (Three.js, loaded only when needed) + checks
   ═════════════════════════════════════════════════════════ */
const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
let THREE = null;

function switchTo2d(reason, byUser = false) {
  if (G.mode2d) return;
  G.mode2d = true;
  G.reason2d = reason;
  if (byUser) G.userChose = true;
  Scene.dispose();
}

function webglAvailable() {
  try {
    const c = document.createElement('canvas');
    return !!(c.getContext('webgl2') || c.getContext('webgl'));
  } catch { return false; }
}

const Scene = {
  state: null, ready: false,
  ren: null, scene: null, cam: null, canvas: null, labels: null, raf: 0,
  own: null, enemy: null, ocean: null, oceanGeo: null, avatar: null,
  mates: {}, stations: [], decals: { own: {}, enemy: {} }, particles: [], projectiles: [], gulls: [], caps: [],
  shake: 0, tex: null, avatarState: { targetX: 0, pending: null }, layout: null, targets: [], lastW: 0, lastH: 0, ownSide: 1,

  async init(team) {
    this.state = 'loading';
    if (!webglAvailable()) return switchTo2d('WebGL is not available');
    try {
      THREE = THREE ?? (await import(THREE_URL));
    } catch {
      return switchTo2d('3D library could not be loaded');
    }
    const host = document.getElementById('sea');
    if (!host || G.mode2d) { this.state = null; return; }
    try {
      this.build(host, team);
    } catch (error) {
      console.warn('[pirates] 3D failed:', error);
      return switchTo2d('3D scene could not start');
    }
    this.ready = true;
    this.state = 'running';
    this.start();
  },

  build(host, team) {
    const canvas = document.createElement('canvas');
    const labels = document.createElement('div');
    labels.className = 'labels';
    host.replaceChildren(canvas, labels);
    this.canvas = canvas;
    this.labels = labels;
    canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); switchTo2d('the graphics card lost the 3D context'); });
    const ren = new THREE.WebGLRenderer({ canvas, antialias: devicePixelRatio < 2 });
    ren.setPixelRatio(Math.min(devicePixelRatio, 2));
    ren.outputColorSpace = THREE.SRGBColorSpace;
    ren.toneMapping = THREE.ACESFilmicToneMapping;
    ren.toneMappingExposure = 1.08;
    this.ren = ren;
    this.tex = makeTextures();
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xc9dfe9, 60, 215);
    this.scene = scene;
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      uniforms: { cTop: { value: new THREE.Color(0x3f87b5) }, cMid: { value: new THREE.Color(0x9fcfe2) }, cBot: { value: new THREE.Color(0xf6d9a8) } },
      vertexShader: 'varying float vY; void main() { vY = normalize(position).y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'varying float vY; uniform vec3 cTop; uniform vec3 cMid; uniform vec3 cBot; void main() { vec3 c = vY > 0.12 ? mix(cMid, cTop, smoothstep(0.12, 0.65, vY)) : mix(cBot, cMid, smoothstep(-0.04, 0.12, vY)); gl_FragColor = vec4(c, 1.0); }',
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(330, 24, 12), skyMat);
    sky.renderOrder = -1;
    scene.add(sky);
    this.cam = new THREE.PerspectiveCamera(52, 1, 0.1, 400);
    scene.add(new THREE.HemisphereLight(0xfff4dd, 0x1d4a5e, 0.95));
    const sun = new THREE.DirectionalLight(0xffe9c0, 1.5);
    sun.position.set(-30, 40, 25);
    scene.add(sun);
    const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(11, 24), new THREE.MeshBasicMaterial({ color: 0xfff3cf, fog: false }));
    sunDisc.position.set(-90, 42, -200);
    sunDisc.lookAt(0, 8, 20);
    scene.add(sunDisc);
    for (let i = 0; i < 8; i++) {
      const c = sprite(this.tex.splash, 24 + Math.random() * 26, 0.42);
      c.material.color = new THREE.Color().setHSL(0.09, 0.3, 0.92);
      c.material.fog = false;
      c.position.set(-140 + Math.random() * 280, 28 + Math.random() * 24, -130 - Math.random() * 60);
      scene.add(c);
    }
    this.oceanGeo = new THREE.PlaneGeometry(400, 260, 48, 30);
    this.ocean = new THREE.Mesh(this.oceanGeo, new THREE.MeshPhongMaterial({ color: 0x1d6f8e, specular: 0x9fd8ea, shininess: 70, transparent: true, opacity: 0.96 }));
    this.ocean.rotation.x = -Math.PI / 2;
    scene.add(this.ocean);
    for (const [ix, iz, s] of [[-95, -150, 1.4], [75, -160, 1.0], [-30, -180, 1.9]]) {
      const isl = new THREE.Mesh(new THREE.ConeGeometry(18 * s, 10 * s, 7), new THREE.MeshLambertMaterial({ color: 0x5d7a6b }));
      isl.position.set(ix, -1, iz);
      scene.add(isl);
    }
    for (let i = 0; i < 4; i++) {
      const gull = new THREE.Group();
      const wingMat = new THREE.MeshBasicMaterial({ color: 0xf6f3ea, side: THREE.DoubleSide });
      const wl = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.28), wingMat); wl.position.x = -0.55;
      const wr = new THREE.Mesh(new THREE.PlaneGeometry(1.1, 0.28), wingMat); wr.position.x = 0.55;
      gull.add(wl, wr);
      gull.userData = { wl, wr, r: 14 + Math.random() * 22, h: 13 + Math.random() * 9, ph: Math.random() * Math.PI * 2, sp: 0.15 + Math.random() * 0.12 };
      scene.add(gull);
      this.gulls.push(gull);
    }
    for (let i = 0; i < 24; i++) {
      const cap = sprite(this.tex.splash, 1.5 + Math.random() * 2.5, 0);
      cap.position.set(-90 + Math.random() * 180, 0.42, 30 - Math.random() * 160);
      cap.userData.ph = Math.random() * Math.PI * 2;
      scene.add(cap);
      this.caps.push(cap);
    }
    this.own = buildShip(team, true, this.stations, this.tex);
    scene.add(this.own);
    this.enemy = buildShip(otherTeam(team), false, null, this.tex);
    this.enemy.position.set(8, 0, -80);
    this.enemy.scale.setScalar(0.8);
    scene.add(this.enemy);
    this.avatar = buildAvatar(team);
    this.avatar.position.set(0, 2.4, 0.95);
    this.own.add(this.avatar);

    const layout = () => {
      if (!this.own || !this.ren) return; // the scene was closed (switched to 2D)
      const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
      ren.setSize(w, h, false);
      const cam = this.cam;
      cam.aspect = w / h;
      if (cam.aspect < 0.9) {
        this.own.rotation.y = Math.PI / 2;
        this.enemy.position.set(-72, this.enemy.position.y, -26);
        cam.position.set(-6, 19, 14);
        cam.lookAt(0, 0.5, -5.5);
      } else {
        this.own.rotation.y = 0;
        this.enemy.position.set(8, this.enemy.position.y, -70);
        cam.position.set(2.0, cam.aspect < 1.4 ? 16 : 13, cam.aspect < 1.4 ? 11.5 : 9.5);
        cam.lookAt(2.0, -1.0, -11.5);
      }
      const toUs = new THREE.Vector3().subVectors(this.own.position, this.enemy.position);
      this.enemy.rotation.y = Math.atan2(toUs.x, toUs.z);
      // Which side of our hull faces the camera (it changes with the portrait / landscape layout).
      this.own.updateMatrixWorld(true);
      this.ownSide = this.own.worldToLocal(cam.position.clone()).z >= 0 ? 1 : -1;
      for (const d of Object.values(this.decals.own)) d.position.z = 1.78 * this.ownSide;
      cam.fov = 52;
      cam.updateProjectionMatrix();
    };
    this.layout = layout;
    this.resize = new ResizeObserver(layout);
    this.resize.observe(canvas);
    layout();
    canvas.addEventListener('pointerdown', (e) => this.onTap(e));
  },

  /** Render loop with the "is the 3D actually visible and fast enough?" checks. */
  start() {
    let last = performance.now(), wake = 0, frames = 0, checkStart = last, checked = false, lowQuality = false;
    const loop = (now) => {
      if (!this.canvas?.isConnected) return this.dispose();
      this.raf = requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, 0.08);
      last = now;
      const t = now * 0.001;
      this.syncSize();
      this.animate(t, dt, (wake += dt) > 0.35 && !(wake = 0));
      this.ren.render(this.scene, this.cam);
      if (!checked) {
        checked = true;
        if (looksBlack(this.ren)) return switchTo2d('the 3D scene renders black on this device');
      }
      frames++;
      if (now - checkStart > 4000) {
        const fps = (frames * 1000) / (now - checkStart);
        frames = 0;
        checkStart = now;
        if (fps < 20 && !lowQuality) { lowQuality = true; this.ren.setPixelRatio(1); this.layout(); }
        else if (fps < 12 && lowQuality && !G.userChose) return switchTo2d(`the 3D scene is too slow here (${Math.round(fps)} fps)`);
      }
      this.updateLabels();
    };
    this.raf = requestAnimationFrame(loop);
  },

  animate(t, dt, wakeNow) {
    const pos = this.oceanGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      pos.setZ(i, Math.sin(x * 0.14 + t * 1.1) * 0.42 + Math.cos(y * 0.19 + t * 0.7) * 0.34);
    }
    pos.needsUpdate = true;
    for (const gull of this.gulls) {
      const u = gull.userData, a = t * u.sp + u.ph;
      gull.position.set(Math.cos(a) * u.r, u.h + Math.sin(t * 0.9 + u.ph) * 1.2, -22 + Math.sin(a) * u.r * 0.7);
      gull.rotation.y = -a;
      const flap = Math.sin(t * 7 + u.ph) * 0.6;
      u.wl.rotation.z = flap; u.wr.rotation.z = -flap;
    }
    for (const cap of this.caps) cap.material.opacity = Math.max(0, Math.sin(t * 0.7 + cap.userData.ph)) * 0.28;
    if (wakeNow && !this.own.userData.sinking) {
      const bow = this.own.localToWorld(new THREE.Vector3(7.6, 0.15, 0));
      this.particle(this.scene, this.tex.splash, bow.x, 0.35, bow.z, { scale: 1.6, vy: 0.25, vx: 0.3, maxLife: 1.1, grow: 1.6, opacity: 0.5 });
    }
    for (const [ship, phase] of [[this.own, 0], [this.enemy, 2.1]]) {
      if (ship.userData.sinking) {
        const st = (ship.userData.sinkT = (ship.userData.sinkT ?? 0) + dt);
        ship.rotation.z = Math.min(0.55, st * 0.16);
        ship.position.y = Math.max(-6.5, -st * 0.9);
        if (st < 4 && Math.random() < 0.3) this.smoke(ship, (Math.random() - 0.5) * 8, 2.5, 1.2);
      } else {
        ship.position.y = Math.sin(t * 0.9 + phase) * 0.28;
        ship.rotation.z = Math.sin(t * 0.7 + phase) * 0.035;
        ship.rotation.x = Math.sin(t * 0.55 + phase * 1.7) * 0.02;
      }
      ship.traverse((o) => {
        if (o.userData.flag) o.rotation.y = Math.sin(t * 3 + phase) * 0.4;
        else if (o.userData.sail) o.scale.x = 1 + Math.sin(t * 1.4 + o.position.x + phase) * 0.05;
      });
    }
    this.moveAvatar(dt);
    this.moveMates(dt);
    this.moveParticles(dt);
    this.moveProjectiles(dt);
    if (this.shake > 0.002) {
      this.cam.position.x += (Math.random() - 0.5) * this.shake;
      this.cam.position.y += (Math.random() - 0.5) * this.shake;
      this.shake *= Math.pow(0.02, dt);
    }
    this.aimCamera();
  },

  /* ---- state → scene ---- */
  sync(state, me) {
    setCarried(this.avatar, state.inventory[me] ?? null);
    const mapping = [['own', G.team, this.own, 1], ['enemy', otherTeam(G.team), this.enemy, 0.85]];
    for (const [slot, team, ship, scale] of mapping) {
      const hits = state.hits[team] || [];
      const seen = new Set();
      for (const h of hits) {
        seen.add(h.id);
        if (!this.decals[slot][h.id]) {
          const s = sprite(this.tex.scorch, (h.sev === 'crit' ? 2.6 : 1.9) * scale, 0.95);
          // above the waterline (waves cut them into half circles), on the side the camera sees
          s.position.set(h.x * 4.6, 1.15 + h.y * 0.95, 1.78 * (slot === 'own' ? this.ownSide : 1));
          if (slot === 'own') { s.material.depthTest = false; s.renderOrder = 10; }
          ship.add(s);
          this.decals[slot][h.id] = s;
        }
        // The size shows how much is still to repair (a partly repaired breach shrinks).
        const size = clamp(1.1 + (h.left ?? 100) / 70, 1.1, 3.4) * scale;
        this.decals[slot][h.id].scale.set(size, size, 1);
      }
      for (const id of Object.keys(this.decals[slot])) {
        if (seen.has(id)) continue;
        const s = this.decals[slot][id];
        s.parent?.remove(s);
        if (slot === 'own') this.particle(this.own, this.tex.glow, s.position.x, s.position.y, s.position.z, { scale: 2, vy: 0.8, maxLife: 0.7, grow: 2 });
        delete this.decals[slot][id];
      }
    }
    if (state.ships[G.team]?.hp <= 0) this.own.userData.sinking = true;
    if (state.ships[otherTeam(G.team)]?.hp <= 0) this.enemy.userData.sinking = true;
  },

  shot(shot, outgoing, done) {
    const src = outgoing ? this.own : this.enemy, dst = outgoing ? this.enemy : this.own;
    const from = new THREE.Vector3(); src.getWorldPosition(from); from.y += 3;
    const to = new THREE.Vector3(); dst.getWorldPosition(to); to.y += 1.6;
    if (shot.label === 'miss') { to.x += (Math.random() - 0.5) * 14; to.z += 6 + Math.random() * 6; to.y = 0; }
    else { to.x += (shot.x ?? 0) * 4; to.y += (shot.y ?? 0.4) * 1.6; }
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 8, 8), new THREE.MeshLambertMaterial({ color: 0x15151a }));
    mesh.position.copy(from);
    this.scene.add(mesh);
    this.explosion(this.scene, from.x, from.y, from.z, false);
    this.projectiles.push({ mesh, from, to, t: 0, dur: 1.15, arcH: 9 + Math.random() * 4, onDone: () => {
      if (shot.label === 'miss') this.splash(to.x, 0, to.z);
      else {
        this.explosion(this.scene, to.x, to.y, to.z, shot.label === 'crit');
        if (!outgoing) this.shake = shot.label === 'crit' ? 0.55 : 0.35;
      }
      done();
    } });
  },

  muzzle(cannonIdx) {
    const cannon = this.own.userData.cannons[cannonIdx] || this.own.userData.cannons[0];
    const p = this.own.localToWorld(new THREE.Vector3(cannon.x, 3.0, -1.9));
    this.explosion(this.scene, p.x, p.y, p.z, false);
    this.shake = Math.max(this.shake, 0.15);
  },

  selfHit() {
    const wp = new THREE.Vector3(); this.own.getWorldPosition(wp);
    this.explosion(this.scene, wp.x, wp.y + 2, wp.z + 1.5, false);
    this.shake = 0.3;
  },

  /* ---- input ---- */
  onTap(e) {
    const state = G.state, me = G.me;
    if (!state || state.phase !== 'battle' || state.aiming[me]) return;
    if ((state.stunnedUntil[me] ?? 0) > G.ui.now()) return floatMsg(L.msgStunned, '#ef476f');
    this.syncSize();
    const rect = this.canvas.getBoundingClientRect();
    const inv = state.inventory[me];
    // 1) The nearest label on screen (what the player sees), repairs first when holding planks.
    const tx = e.clientX - rect.left, ty = e.clientY - rect.top;
    const reach = Math.max(48, Math.min(rect.width, rect.height) * 0.11);
    const near = (list) => list
      .map((t) => ({ ...t, d: Math.hypot(t.x - tx, t.y - ty) }))
      .filter((t) => t.d <= reach)
      .sort((a, b) => a.d - b.d)[0];
    const picked = (inv === 'plank' && near(this.targets.filter((t) => t.kind === 'repair'))) || near(this.targets.filter((t) => t.kind !== 'repair'));
    if (picked) return this.tapTarget(picked, inv);
    const ray = new THREE.Raycaster();
    ray.setFromCamera({ x: ((e.clientX - rect.left) / rect.width) * 2 - 1, y: -((e.clientY - rect.top) / rect.height) * 2 + 1 }, this.cam);
    const decals = Object.entries(this.decals.own);
    if (decals.length) {
      const hit = ray.intersectObjects(decals.map(([, s]) => s))[0];
      if (hit) {
        const hitId = decals.find(([, s]) => s === hit.object)?.[0];
        if (state.inventory[me] !== 'plank') return floatMsg(L.msgNeedPlank, '#f0c96c');
        return this.walkTo(hit.object.position.x, () => game.act('repair', { hitId }));
      }
    }
    // 2) Otherwise the 3D objects themselves.
    const station = ray.intersectObjects(this.stations)[0]?.object.userData;
    if (station?.station === 'ammo') {
      if (inv === 'ball') return floatMsg(L.msgHaveBall, '#f0c96c');
      return this.walkTo(this.own.userData.ammoX, () => game.act('request_question', { crate: 'ammo' }));
    }
    if (station?.station === 'material') {
      if (inv === 'plank') return floatMsg(L.msgHavePlank, '#f0c96c');
      return this.walkTo(this.own.userData.materialX, () => game.act('request_question', { crate: 'material' }));
    }
    if (station?.station === 'cannon') {
      if (inv !== 'ball') return floatMsg(L.msgNeedBall, '#f0c96c');
      const idx = station.idx ?? 0;
      return this.walkTo(this.own.userData.cannons[idx].x, () => game.act('aim', { cannon: idx }));
    }
    const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -(this.own.position.y + 2.3));
    const target = new THREE.Vector3();
    if (ray.ray.intersectPlane(plane, target)) {
      const local = this.own.worldToLocal(target.clone());
      if (Math.abs(local.x) < 7.5 && Math.abs(local.z) < 5) this.walkTo(local.x, null);
    }
  },

  /** A tapped label: the station, the cannons, or a breach to repair. */
  tapTarget(t, inv) {
    if (t.kind === 'repair') {
      if (inv !== 'plank') return floatMsg(L.msgNeedPlank, '#f0c96c');
      return this.walkTo(t.localX, () => game.act('repair', { hitId: t.hitId }));
    }
    if (t.kind === 'ammo') {
      if (inv === 'ball') return floatMsg(L.msgHaveBall, '#f0c96c');
      return this.walkTo(this.own.userData.ammoX, () => game.act('request_question', { crate: 'ammo' }));
    }
    if (t.kind === 'material') {
      if (inv === 'plank') return floatMsg(L.msgHavePlank, '#f0c96c');
      return this.walkTo(this.own.userData.materialX, () => game.act('request_question', { crate: 'material' }));
    }
    if (inv !== 'ball') return floatMsg(L.msgNeedBall, '#f0c96c');
    return this.walkTo(this.own.userData.cannons[1].x, () => game.act('aim', { cannon: 1 }));
  },

  /** Keeps the renderer in step with the canvas (iOS Safari resizes the page as its toolbars move). */
  syncSize() {
    const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
    if (w && h && (w !== this.lastW || h !== this.lastH)) {
      this.lastW = w;
      this.lastH = h;
      this.layout();
    }
  },

  walkTo(x, then) {
    if (G.walking) return;
    const target = clamp(x, -4.9, 4.9);
    // Any distance takes WALK_MS (the 2D deck uses the same time: fair for both).
    this.avatarState.speed = Math.max(Math.abs(target - this.avatar.position.x) / (WALK_MS / 1000), 0.5);
    this.avatarState.targetX = target;
    this.avatarState.pending = then;
    G.walking = true;
    game.act('move', { x: this.avatarState.targetX });
  },

  moveAvatar(dt) {
    const a = this.avatar, s = this.avatarState;
    const dx = s.targetX - a.position.x;
    if (Math.abs(dx) > 0.06) {
      a.position.x += Math.sign(dx) * Math.min(Math.abs(dx), (s.speed ?? 3.4) * dt);
      a.position.y = 2.4 + Math.abs(Math.sin(performance.now() * 0.012)) * 0.09;
      a.rotation.y = dx > 0 ? 0.3 : -0.3;
    } else {
      a.position.y = 2.4;
      a.rotation.y = 0;
      G.walking = false;
      if (s.pending) { const then = s.pending; s.pending = null; then(); }
    }
  },

  moveMates(dt) {
    const state = G.state;
    if (!state) return;
    const ids = (state.teams[G.team] ?? []).filter((id) => id !== G.me && id !== 'ai');
    ids.forEach((pid, i) => {
      if (!this.mates[pid]) {
        const m = buildAvatar(G.team);
        m.scale.setScalar(0.9);
        const x0 = -2.5 + (i % 5) * 1.3;
        m.position.set(x0, 2.4, 0.3);
        this.own.add(m);
        this.mates[pid] = { mesh: m, cur: x0, tgt: x0 };
      }
      const px = state.positions[pid];
      if (typeof px === 'number') this.mates[pid].tgt = px;
    });
    for (const pid of Object.keys(this.mates)) {
      const M = this.mates[pid];
      if (!ids.includes(pid)) { this.own.remove(M.mesh); delete this.mates[pid]; continue; }
      M.cur += (M.tgt - M.cur) * Math.min(1, dt * 3.5);
      M.mesh.position.x = M.cur;
      const moving = Math.abs(M.tgt - M.cur) > 0.08;
      M.mesh.position.y = 2.4 + (moving ? Math.abs(Math.sin(performance.now() * 0.011 + M.cur)) * 0.08 : 0);
    }
  },

  /** Looking down the swaying barrel while aiming (same sway as the authority computes). */
  aimCamera() {
    const aim = G.state?.aiming?.[G.me];
    if (!aim || G.state.phase !== 'battle' || G.ui?.isPending('fire')) {
      if (this.aiming) { this.aiming = false; this.layout(); }
      return;
    }
    this.aiming = true;
    const elapsed = clamp(G.ui.now() - aim.start, 0, AIM_MS);
    const s = sway(aim.seed, elapsed);
    const cannon = this.own.userData.cannons[aim.cannon] || this.own.userData.cannons[0];
    const cpos = this.own.localToWorld(new THREE.Vector3(cannon.x, 3.15, -1.35));
    const target = new THREE.Vector3(); this.enemy.getWorldPosition(target); target.y += 2.2;
    this.cam.fov = 38;
    this.cam.updateProjectionMatrix();
    this.cam.position.copy(cpos);
    this.cam.lookAt(target);
    this.cam.rotateY(s.yaw);
    this.cam.rotateX(s.pitch);
  },

  updateLabels() {
    const state = G.state, me = G.me;
    this.targets = [];
    if (!state || state.phase !== 'battle' || this.aiming) { if (this.labels.innerHTML) this.labels.innerHTML = ''; return; }
    const rect = this.canvas.getBoundingClientRect();
    const inv = state.inventory[me] ?? null;
    const project = (v) => { const p = v.project(this.cam); return p.z > 1 ? null : { x: (p.x * 0.5 + 0.5) * rect.width, y: (-p.y * 0.5 + 0.5) * rect.height }; };
    let html = '';
    for (const d of [{ id: 'ammo', text: L.magazine, x: -3.6, y: 4.3 }, { id: 'material', text: L.carpenter, x: 4.2, y: 3.9 }, { id: 'cannon', text: L.cannons, x: 0.2, y: 4.1 }]) {
      const p = project(this.own.localToWorld(new THREE.Vector3(d.x, d.y, 0)));
      if (!p) continue;
      const cls = d.id === 'cannon' ? (inv === 'ball' ? ' ok' : ' dim') : d.id === 'ammo' ? (inv === 'ball' ? ' dim' : ' ok') : (inv === 'plank' ? ' dim' : ' ok');
      html += `<div class="slabel${cls}" style="left:${p.x}px;top:${p.y}px">${d.text}</div>`;
      this.targets.push({ kind: d.id, x: p.x, y: p.y - 10 }); // the label sits above its point
    }
    if (inv === 'plank') {
      for (const [hitId, s] of Object.entries(this.decals.own)) {
        const p = project(s.getWorldPosition(new THREE.Vector3()));
        if (!p) continue;
        html += `<div class="slabel ok" style="left:${p.x}px;top:${p.y}px">${L.repair}</div>`;
        this.targets.push({ kind: 'repair', x: p.x, y: p.y - 10, hitId, localX: s.position.x });
      }
    }
    if (this.labels.innerHTML !== html) this.labels.innerHTML = html;
  },

  /* ---- effects ---- */
  particle(parent, tex, x, y, z, o = {}) {
    const s = sprite(tex, o.scale ?? 1.5, o.opacity ?? 0.9);
    s.position.set(x, y, z);
    parent.add(s);
    this.particles.push({ s, parent, vx: o.vx ?? 0, vy: o.vy ?? 0.9, vz: o.vz ?? 0, life: 0, max: o.maxLife ?? 1.6, grow: o.grow ?? 1.2 });
  },
  smoke(ship, x, y, scale = 1) {
    this.particle(ship, this.tex.smoke, x + (Math.random() - 0.5) * 0.4, y, 1.4, { scale: scale * (0.8 + Math.random() * 0.8), vy: 0.7 + Math.random() * 0.5, vx: 0.25 + Math.random() * 0.2, maxLife: 1.4 + Math.random(), grow: 1.5, opacity: 0.55 });
  },
  explosion(parent, x, y, z, big) {
    this.particle(parent, this.tex.boom, x, y, z, { scale: big ? 4.5 : 2.8, vy: 0.4, maxLife: 0.5, grow: 5, opacity: 1 });
    for (let i = 0; i < (big ? 8 : 4); i++) this.particle(parent, this.tex.smoke, x, y, z, { scale: 1 + Math.random(), vx: (Math.random() - 0.5) * 3, vy: 1 + Math.random() * 2, vz: (Math.random() - 0.5) * 2, maxLife: 1 + Math.random(), grow: 2, opacity: 0.7 });
  },
  splash(x, y, z) {
    this.particle(this.scene, this.tex.splash, x, y + 0.5, z, { scale: 3, vy: 1.6, maxLife: 0.8, grow: 2.4, opacity: 0.95 });
  },
  moveParticles(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life += dt;
      if (p.life >= p.max) { p.parent.remove(p.s); p.s.material.dispose(); this.particles.splice(i, 1); continue; }
      p.s.position.x += p.vx * dt; p.s.position.y += p.vy * dt; p.s.position.z += p.vz * dt;
      const sc = p.s.scale.x * (1 + p.grow * dt * 0.6);
      p.s.scale.set(sc, sc, 1);
      p.s.material.opacity = (1 - p.life / p.max) * 0.9;
    }
  },
  moveProjectiles(dt) {
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.t += dt / p.dur;
      if (p.t >= 1) { this.scene.remove(p.mesh); this.projectiles.splice(i, 1); p.onDone(); continue; }
      p.mesh.position.lerpVectors(p.from, p.to, p.t);
      p.mesh.position.y += Math.sin(p.t * Math.PI) * p.arcH;
    }
  },

  dispose() {
    cancelAnimationFrame(this.raf);
    this.resize?.disconnect();
    this.resize = null;
    try { this.ren?.dispose(); } catch { /* ignore */ }
    Object.assign(this, { state: null, ready: false, ren: null, scene: null, canvas: null, labels: null, own: null, enemy: null, avatar: null, mates: {}, stations: [], decals: { own: {}, enemy: {} }, particles: [], projectiles: [], gulls: [], caps: [], aiming: false });
  },
};

/** True when the rendered frame is (almost) completely black: a broken GPU driver. */
function looksBlack(ren) {
  try {
    const gl = ren.getContext();
    const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
    const px = new Uint8Array(4);
    let dark = 0;
    for (const [x, y] of [[w / 2, h - 4], [w / 4, h * 0.8], [w * 0.75, h * 0.8]]) {
      gl.readPixels(Math.floor(x), Math.floor(y), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
      if (px[0] + px[1] + px[2] < 24) dark++;
    }
    return dark === 3;
  } catch { return false; }
}

function makeTextures() {
  const radial = (inner, outer, stops) => {
    const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
    const c = cv.getContext('2d');
    const g = c.createRadialGradient(64, 64, inner, 64, 64, outer);
    for (const [o, col] of stops) g.addColorStop(o, col);
    c.fillStyle = g; c.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  };
  return {
    scorch: radial(4, 60, [[0, 'rgba(12,8,4,0.95)'], [0.45, 'rgba(20,12,6,0.8)'], [1, 'rgba(0,0,0,0)']]),
    smoke: radial(4, 60, [[0, 'rgba(70,70,74,0.65)'], [1, 'rgba(70,70,74,0)']]),
    boom: radial(2, 60, [[0, 'rgba(255,240,180,1)'], [0.35, 'rgba(255,150,50,0.9)'], [1, 'rgba(200,60,20,0)']]),
    splash: radial(4, 60, [[0, 'rgba(235,250,255,0.9)'], [1, 'rgba(180,220,240,0)']]),
    glow: radial(2, 60, [[0, 'rgba(255,235,170,0.9)'], [1, 'rgba(255,200,80,0)']]),
  };
}
function sprite(tex, scale, opacity = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity, depthWrite: false }));
  s.scale.set(scale, scale, 1);
  return s;
}

function buildShip(teamKey, detail, stations, tex) {
  const T = TEAMS[teamKey];
  const W = (c) => new THREE.MeshLambertMaterial({ color: c });
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z, setup) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); setup?.(m); g.add(m); return m; };
  add(new THREE.BoxGeometry(11, 2.4, 3.4), W(T.hullColor), 0, 1.1, 0);
  add(new THREE.BoxGeometry(11.25, 0.4, 3.6), W(T.trimColor), 0, 2.0, 0);
  buildBow(g, W(T.hullColor), W(0x9a7648), W(T.trimColor));
  add(new THREE.BoxGeometry(2.6, 1.7, 3.0), W(T.hullColor), -4.5, 3.0, 0);
  add(new THREE.BoxGeometry(2.9, 0.25, 3.3), W(T.trimColor), -4.5, 3.95, 0);
  add(new THREE.BoxGeometry(10.4, 0.22, 3.0), W(0x9a7648), 0, 2.3, 0);
  for (const zz of [-1.55, 1.55]) add(new THREE.BoxGeometry(10.4, 0.5, 0.14), W(T.trimColor), 0, 2.75, zz);
  add(new THREE.BoxGeometry(11.35, 0.55, 3.05), W(0x2a1a0f), 0, -0.05, 0);
  for (const zz of [1.73, -1.73]) for (let i = 0; i < 4; i++) add(new THREE.BoxGeometry(0.56, 0.46, 0.07), W(0x140f0a), -3.4 + i * 2.2, 1.3, zz);
  add(new THREE.CylinderGeometry(0.07, 0.12, 3.6, 6), W(0x7a5a34), 9.9, 3.45, 0, (m) => { m.rotation.z = -1.12; });
  const sailMat = new THREE.MeshLambertMaterial({ color: T.sailColor, side: THREE.DoubleSide });
  for (const [mx, mh, sw] of [[2.3, 8.4, 3.6], [-1.6, 7.2, 3.0]]) {
    add(new THREE.CylinderGeometry(0.13, 0.19, mh, 6), W(0x7a5a34), mx, 2.3 + mh / 2, 0);
    for (const [sy, ss] of [[0.76, 0.95], [0.52, 0.72]]) {
      const sw2 = sw * ss, sh2 = mh * 0.24, r = sw2 * 1.15;
      const theta = 2 * Math.asin(Math.min(1, sw2 / (2 * r)));
      const geo = new THREE.CylinderGeometry(r, r * 0.93, sh2, 10, 1, true, -theta / 2, theta);
      geo.translate(0, 0, -r);
      add(geo, sailMat, mx + 0.3, 2.3 + mh * sy, 0, (m) => { m.rotation.y = 1.05; m.userData.sail = true; });
    }
  }
  add(new THREE.PlaneGeometry(1.5, 0.9), new THREE.MeshBasicMaterial({ color: T.flagColor, side: THREE.DoubleSide }), 3.1, 11.0, 0, (m) => { m.userData.flag = true; });
  if (detail) {
    for (const [bx, bz] of [[-1.4, 1.05], [1.2, 1.1], [-4.6, -0.9]]) add(new THREE.CylinderGeometry(0.28, 0.3, 0.6, 9), W(0x8a6134), bx, 2.7, bz);
    add(new THREE.TorusGeometry(0.42, 0.055, 6, 12), W(0x7a5a34), -3.05, 4.35, 0, (m) => { m.rotation.y = Math.PI / 2; });
    add(new THREE.SphereGeometry(0.17, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffd98a }), -6.0, 4.3, 0);
    const glow = sprite(tex.glow, 1.7, 0.75); glow.position.set(-6.0, 4.3, 0); g.add(glow);
    const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
    const hitBox = (x, z, station, idx) => add(new THREE.BoxGeometry(2.3, 3.0, 2.4), hitMat, x, 3.4, z, (m) => { m.userData = { station, idx }; stations.push(m); });
    g.userData.cannons = [];
    [-2.2, 0.2, 2.6].forEach((cx, i) => {
      add(new THREE.BoxGeometry(0.8, 0.5, 0.7), W(0x4a3a2a), cx, 2.6, -1.05, (m) => { m.userData = { station: 'cannon', idx: i }; stations.push(m); });
      add(new THREE.CylinderGeometry(0.16, 0.22, 1.5, 8), W(0x2b2b30), cx, 2.95, -1.45, (m) => { m.rotation.x = Math.PI / 2 - 0.28; m.userData = { station: 'cannon', idx: i }; stations.push(m); });
      hitBox(cx, -1.05, 'cannon', i);
      g.userData.cannons.push({ x: cx });
    });
    add(new THREE.BoxGeometry(1.3, 0.9, 1.1), W(0x33261a), -3.6, 2.85, 0.7, (m) => { m.userData = { station: 'ammo' }; stations.push(m); });
    for (const [bx, bz] of [[-3.85, 0.55], [-3.35, 0.55], [-3.6, 0.95]]) add(new THREE.SphereGeometry(0.22, 8, 8), W(0x1c1c22), bx, 3.5, bz);
    hitBox(-3.6, 0.7, 'ammo');
    g.userData.ammoX = -3.6;
    for (let i = 0; i < 4; i++) add(new THREE.BoxGeometry(1.6, 0.14, 0.5), W(i % 2 ? 0xb98d54 : 0xa87a44), 4.2 + (i % 2) * 0.12, 2.5 + i * 0.16, 0.7, (m) => { m.rotation.y = (i % 2) * 0.25; m.userData = { station: 'material' }; stations.push(m); });
    hitBox(4.2, 0.7, 'material');
    g.userData.materialX = 4.2;
  }
  return g;
}

/**
 * The bow: a wedge that continues the hull (narrower keel, a raked stem) and rises
 * towards the tip, with a forecastle deck, a trim stripe and rails.
 */
function buildBow(g, hullMat, deckMat, trimMat) {
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const TL = V(5.5, 2.3, -1.7), TR = V(5.5, 2.3, 1.7), BL = V(5.5, -0.1, -1.15), BR = V(5.5, -0.1, 1.15);
  const ML = V(7.3, 1.35, -0.95), MR = V(7.3, 1.35, 0.95); // the curve of the flanks
  const T = V(8.9, 2.85, 0), S = V(7.3, -0.1, 0);
  const tris = (list) => {
    const geo = new THREE.BufferGeometry().setFromPoints(list.flat());
    geo.computeVertexNormals();
    return geo;
  };
  const sides = tris([[TL, BL, ML], [TL, ML, T], [BL, S, ML], [ML, S, T], [TR, MR, BR], [TR, T, MR], [BR, MR, S], [MR, T, S], [BL, BR, S]]);
  g.add(new THREE.Mesh(sides, Object.assign(hullMat.clone(), { side: THREE.DoubleSide })));
  const deck = new THREE.Mesh(tris([[V(5.4, 2.32, -1.6), V(5.4, 2.32, 1.6), V(8.7, 2.84, 0)]]), Object.assign(deckMat.clone(), { side: THREE.DoubleSide }));
  g.add(deck);
  const beam = (a, b, thick, mat) => {
    const dir = b.clone().sub(a);
    const m = new THREE.Mesh(new THREE.BoxGeometry(dir.length(), thick, thick), mat);
    m.position.copy(a.clone().add(b).multiplyScalar(0.5));
    m.quaternion.setFromUnitVectors(V(1, 0, 0), dir.normalize());
    g.add(m);
  };
  for (const z of [-1, 1]) {
    beam(V(5.4, 2.0, 1.78 * z), V(8.6, 2.55, 0.08 * z), 0.32, trimMat);   // trim stripe
    beam(V(5.4, 2.75, 1.55 * z), V(8.5, 3.15, 0.08 * z), 0.14, trimMat);  // rail
  }
}

function buildAvatar(teamKey) {
  const T = TEAMS[teamKey];
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.75, 8), new THREE.MeshLambertMaterial({ color: T.trimColor })); body.position.y = 0.45;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21, 10, 8), new THREE.MeshLambertMaterial({ color: 0xd9a97c })); head.position.y = 1.0;
  const band = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2.4), new THREE.MeshLambertMaterial({ color: T.flagColor })); band.position.y = 1.06;
  const carry = new THREE.Group(); carry.position.set(0.32, 0.75, 0);
  g.add(body, head, band, carry);
  g.userData.carry = carry;
  return g;
}

function setCarried(avatar, inv) {
  const carry = avatar?.userData.carry;
  if (!carry || carry.userData.inv === inv) return;
  carry.userData.inv = inv;
  carry.clear();
  if (inv === 'ball') carry.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshLambertMaterial({ color: 0x1c1c22 })));
  else if (inv === 'plank') { const p = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.1, 0.3), new THREE.MeshLambertMaterial({ color: 0xb98d54 })); p.rotation.z = 0.4; carry.add(p); }
}

/** Moves the 2D sight with the same sway as the 3D barrel; distance from the centre = 1 − accuracy. */
let aim2dRaf = 0;
function aim2dLoop() {
  if (aim2dRaf) return;
  const step = () => {
    const aim = G.state?.aiming?.[G.me];
    const field = document.getElementById('aim2d');
    const reticle = field?.querySelector('.reticle2d');
    if (!aim || !G.mode2d || !reticle) { aim2dRaf = 0; return; }
    const r = Math.min(field.clientWidth, field.clientHeight) * 0.22; // radius where accuracy reaches 0
    field.style.setProperty('--r2', `${r * 2}px`);
    const s = sway(aim.seed, clamp(G.ui.now() - aim.start, 0, AIM_MS));
    reticle.style.transform = `translate(${(s.yaw / 0.13) * r}px, ${(-s.pitch / 0.13) * r}px)`;
    aim2dRaf = requestAnimationFrame(step);
  };
  aim2dRaf = requestAnimationFrame(step);
}

/* ═════════════════════════════════════════════════════════
   Device-only buttons (not game actions)
   ═════════════════════════════════════════════════════════ */
document.addEventListener('pointerdown', (e) => {
  const local = e.target.closest?.('[data-local]')?.getAttribute('data-local');
  if (local === 'fire') {
    e.preventDefault();
    game.act('fire', { t: G.ui?.now() });
    if (Scene.ready) Scene.muzzle(G.state?.aiming?.[G.me]?.cannon ?? 1); // the flash right away
  }
});
document.addEventListener('click', (e) => {
  const el = e.target.closest?.('[data-local]');
  const local = el?.getAttribute('data-local');
  if (local === 'go2d') {
    if (!el.disabled) go2d(el.getAttribute('data-to'), el.getAttribute('data-hit'));
    return;
  }
  if (local !== 'toggle2d') return;
  if (G.mode2d) { G.mode2d = false; G.reason2d = null; G.userChose = true; }
  else switchTo2d('switched by the player', true);
});
