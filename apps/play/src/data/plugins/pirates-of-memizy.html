<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Pirates of Memizy</title>
  <script type="application/oqse-manifest+json">
  {
    "version": "0.2",
    "id": "https://memizy.com/plugins/pirates-of-memizy",
    "appName": "Pirates of Memizy",
    "pluginVersion": "2.0.0",
    "description": "Two pirate crews battle at sea: answer questions to earn cannonballs and repair planks, aim your shots and sink the enemy ship. Solo: you against an enemy galleon.",
    "author": { "name": "BC Praha" },
    "locales": ["cs", "en"],
    "tags": ["quiz", "multiplayer", "solo", "game", "pirates", "teams", "battle", "3d"],
    "capabilities": {
      "actions": ["render"],
      "types": ["mcq-single", "mcq-multi", "true-false", "match-pairs", "sort-items", "short-answer"],
      "features": ["markdown", "latex"]
    },
    "appSpecific": {
      "memizy": {
        "protocol": "1.0",
        "modes": {
          "solo": {},
          "multiplayer": { "players": { "min": 1, "max": 60, "recommended": 10 }, "hostAs": ["presenter"], "lateJoin": true }
        },
        "settings": [
          { "id": "timerSec", "type": "number", "label": { "cs": "Sekundy na otázku", "en": "Seconds per question" }, "default": 20, "min": 5, "max": 120 },
          { "id": "expectedMin", "type": "number", "label": { "cs": "Bitva potrvá zhruba (minuty)", "en": "The battle takes about (minutes)" }, "description": { "cs": "Podle toho se spočítá odolnost lodí.", "en": "The strength of the hulls is computed from it." }, "default": 5, "min": 2, "max": 20 },
          { "id": "battleMin", "type": "number", "label": { "cs": "Časový limit (minuty)", "en": "Time limit (minutes)" }, "description": { "cs": "Když se do té doby žádná loď nepotopí, vyhraje pevnější trup.", "en": "If no ship sinks by then, the stronger hull wins." }, "default": 10, "min": 2, "max": 40 },
          { "id": "aimMode", "type": "boolean", "label": { "cs": "Zaměřovací minihra", "en": "Aiming minigame" }, "description": { "cs": "Poškození závisí na přesnosti výstřelu.", "en": "Damage depends on the accuracy of the shot." }, "default": true },
          { "id": "doShuffle", "type": "boolean", "label": { "cs": "Míchat otázky", "en": "Shuffle questions" }, "default": true },
          { "id": "enemySkill", "type": "select", "label": { "cs": "Síla počítačové lodi", "en": "Computer ship strength" }, "description": { "cs": "V solu a když se všichni hráči přidají k jedné posádce.", "en": "In solo, and when all players join one crew." }, "default": "normal",
            "options": [
              { "value": "easy", "label": { "cs": "Slabá", "en": "Weak" } },
              { "value": "normal", "label": { "cs": "Normální", "en": "Normal" } },
              { "value": "hard", "label": { "cs": "Silná", "en": "Strong" } }
            ] }
        ],
        "display": { "orientation": "portrait" }
      }
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --deep: #06121f; --panel: rgba(8, 20, 33, 0.94); --border: rgba(212, 165, 74, 0.4);
      --gold: #d4a54a; --gold-bright: #f0c96c; --red-team: #e63946; --red-team-soft: #ff7d88;
      --black-team: #8d99ae; --black-team-soft: #c9d3e4; --green: #2ec27e; --danger: #ef476f; --blue: #4cc9f0;
    }
    html, body { height: 100%; overflow: hidden; background: var(--deep); color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; touch-action: manipulation; }
    #app { height: 100vh; height: 100dvh; position: relative; overflow: hidden; }
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px; gap: 14px; overflow-y: auto; }
    .panel { background: linear-gradient(160deg, rgba(16,32,50,0.97), rgba(8,18,30,0.97)); border: 1.5px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 560px; box-shadow: 0 18px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06); }
    .panel-title { font-size: 24px; font-weight: 900; color: var(--gold-bright); text-align: center; letter-spacing: 0.03em; }
    .panel-sub { font-size: 13px; color: #93a5b8; text-align: center; margin-top: 4px; margin-bottom: 16px; }
    .big-emoji { text-align: center; font-size: 52px; }
    .gbtn { border: none; border-radius: 12px; padding: 12px 26px; font-size: 15px; font-weight: 800; cursor: pointer; letter-spacing: 0.02em; }
    .gbtn:disabled { opacity: 0.45; cursor: not-allowed; }
    .gbtn.pri { background: linear-gradient(180deg, var(--gold-bright), #b3862f); color: #221604; }
    .gbtn.sec { background: #2c3b4d; color: #dbe5f0; }
    .gbtn.danger { background: var(--danger); color: #fff; }
    .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
    .muted { font-size: 12px; color: #8fa1b4; text-align: center; }

    /* team select */
    .teams-wrap { display: flex; gap: 12px; width: 100%; max-width: 760px; flex-wrap: wrap; justify-content: center; }
    .team-card { flex: 1; min-width: 250px; max-width: 370px; background: var(--panel); border: 2px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .team-card.red-side { border-color: rgba(230,57,70,0.55); }
    .team-card.black-side { border-color: rgba(141,153,174,0.55); }
    .team-card.mine { box-shadow: 0 0 24px rgba(212,165,74,0.35); border-color: var(--gold); }
    .team-flag { font-size: 40px; text-align: center; }
    .team-name { font-size: 17px; font-weight: 900; text-align: center; }
    .red-side .team-name { color: var(--red-team-soft); }
    .black-side .team-name { color: var(--black-team-soft); }
    .team-count { font-size: 12px; color: #8fa1b4; text-align: center; }
    .team-roster { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 30px; }
    .chip { background: rgba(255,255,255,0.09); border-radius: 20px; padding: 4px 11px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
    .chip.me { background: rgba(212,165,74,0.28); border: 1px solid var(--gold); }
    .join-btn { border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 800; cursor: pointer; color: #fff; }
    .red-side .join-btn { background: linear-gradient(180deg, #ff5964, #c22833); }
    .black-side .join-btn { background: linear-gradient(180deg, #5f6f8a, #39445c); }
    .join-btn:disabled { opacity: 0.5; cursor: default; }

    /* board dashboard */
    .dash { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--deep); }
    .hd-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: rgba(0,0,0,0.45); gap: 8px; }
    .hd-title { font-size: 22px; font-weight: 900; color: var(--gold-bright); }
    .hd-timer { font-size: 34px; font-weight: 900; background: rgba(212,165,74,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 4px 18px; font-variant-numeric: tabular-nums; }
    .hd-ships { display: flex; gap: 14px; padding: 14px 18px; flex-wrap: wrap; }
    .hd-ship { flex: 1; min-width: 300px; background: var(--panel); border-radius: 14px; padding: 14px 16px; border: 1.5px solid rgba(255,255,255,0.1); }
    .hd-ship.red-side { border-color: rgba(230,57,70,0.5); }
    .hd-ship.black-side { border-color: rgba(141,153,174,0.5); }
    .hd-ship-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 20px; font-weight: 900; }
    .hpbar { height: 26px; border-radius: 13px; background: rgba(255,255,255,0.09); overflow: hidden; border: 1px solid rgba(255,255,255,0.12); }
    .hpfill { height: 100%; border-radius: 13px; transition: width 0.5s ease; }
    .hd-ship-stats { display: flex; gap: 14px; margin-top: 10px; font-size: 15px; color: #b6c5d4; flex-wrap: wrap; }
    .feed { flex: 1; overflow-y: auto; padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 7px; }
    .feed-item { background: rgba(255,255,255,0.05); border-radius: 8px; padding: 9px 13px; font-size: 17px; display: flex; gap: 10px; align-items: flex-start; }
    .feed-item.hit, .feed-item.wrong { border-left: 4px solid var(--danger); }
    .feed-item.crit, .feed-item.sys { border-left: 4px solid var(--gold); }
    .feed-item.miss { border-left: 4px solid #5a6c80; }
    .feed-item.repair { border-left: 4px solid var(--green); }
    .feed-item.correct { border-left: 4px solid var(--blue); }
    .feed-detail { color: #8698ab; font-size: 13px; margin-top: 2px; }
    .section-lbl { font-size: 12px; color: #6f8296; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; padding: 6px 18px; }

    /* leaderboard */
    .lb-row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; font-size: 14px; }
    .lb-rank { color: var(--gold-bright); font-weight: 800; min-width: 30px; }
    .lb-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .lb-score { color: var(--gold); font-weight: 700; margin-left: auto; }

    /* game */
    .game { position: absolute; inset: 0; }
    #sea { position: absolute; inset: 0; }
    #sea canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .slabel { position: absolute; transform: translate(-50%,-100%); background: rgba(4,12,20,0.82); border: 1px solid var(--border); border-radius: 7px; padding: 3px 9px; font-size: 11px; font-weight: 800; color: var(--gold-bright); white-space: nowrap; }
    .slabel.ok { border-color: var(--green); color: #b7f4d5; }
    .slabel.dim { opacity: 0.55; }
    .hud-top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: 8px 10px 6px; background: linear-gradient(to bottom, rgba(3,9,16,0.92), transparent); display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
    .hp-row { display: flex; align-items: center; gap: 8px; }
    .hp-label { font-size: 11px; font-weight: 800; min-width: 74px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .hp-track { flex: 1; height: 13px; border-radius: 7px; background: rgba(255,255,255,0.13); overflow: hidden; border: 1px solid rgba(255,255,255,0.18); }
    .hp-fill { height: 100%; border-radius: 7px; transition: width 0.45s ease; }
    .hud-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; gap: 6px; }
    .hud-timer { font-size: 16px; font-weight: 900; color: var(--gold-bright); text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-variant-numeric: tabular-nums; }
    .hud-score { font-size: 13px; font-weight: 800; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .hud-inv { font-size: 13px; font-weight: 800; background: rgba(0,0,0,0.55); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; }
    .hud-bot { position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; padding: 10px 12px 12px; background: linear-gradient(to top, rgba(3,9,16,0.93), transparent); display: flex; align-items: center; gap: 10px; }
    .hint { flex: 1; font-size: 13px; font-weight: 700; color: #ffe9b8; text-shadow: 0 1px 6px rgba(0,0,0,0.85); pointer-events: none; }
    .streak { font-size: 12px; font-weight: 800; color: var(--blue); pointer-events: none; }
    .mode-btn { pointer-events: auto; border: 1px solid var(--border); background: rgba(0,0,0,0.55); color: #ffe9b8; border-radius: 10px; padding: 5px 10px; font-size: 11px; font-weight: 800; cursor: pointer; }
    .stun { position: absolute; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 18%; background: rgba(239,71,111,0.12); box-shadow: inset 0 0 110px rgba(239,71,111,0.5); pointer-events: none; }
    .stun-text { font-size: 26px; font-weight: 900; background: var(--danger); padding: 8px 22px; border-radius: 14px; border: 3px solid #fff; animation: shake .25s infinite; }
    .stun-cd { font-size: 20px; font-weight: 800; background: #06121f; padding: 4px 16px; border-radius: 10px; margin-top: 8px; border: 2px solid rgba(255,255,255,0.25); }
    @keyframes shake { 0%,100% { transform: translateX(0); } 33% { transform: translateX(-5px); } 66% { transform: translateX(5px); } }
    .float { position: absolute; top: 38%; left: 50%; transform: translate(-50%,-50%); z-index: 70; pointer-events: none; font-size: 24px; font-weight: 900; text-shadow: 0 2px 12px rgba(0,0,0,0.95); text-align: center; padding: 0 12px; width: 100%; }
    .result-banner { position: absolute; inset: 0; z-index: 80; display: flex; align-items: center; justify-content: center; background: rgba(3,9,16,0.55); }
    .result-banner div { font-size: 30px; font-weight: 900; text-align: center; text-shadow: 0 4px 18px rgba(0,0,0,0.9); padding: 18px 30px; border-radius: 20px; background: rgba(4,12,20,0.8); border: 2px solid var(--border); margin: 0 16px; }

    /* 2D deck */
    .deck2d { position: absolute; inset: 0; padding: 104px 14px 64px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
      background: radial-gradient(ellipse at 50% 120%, #1d6f8e 0%, #0b3a52 55%, #06121f 100%); }
    .ships2d { display: flex; justify-content: space-around; align-items: center; font-size: 46px; padding: 8px 0; }
    .ships2d .vs { font-size: 16px; color: var(--gold-bright); font-weight: 900; }
    .station { display: flex; align-items: center; gap: 12px; width: 100%; border: 2px solid var(--border); border-radius: 16px; padding: 14px 16px; background: rgba(8,20,33,0.9); color: #fff; font-size: 17px; font-weight: 800; cursor: pointer; text-align: left; }
    .station .ico { font-size: 30px; }
    .station small { display: block; font-size: 12px; color: #93a5b8; font-weight: 600; }
    .station.ok { border-color: var(--green); }
    .station:disabled { opacity: 0.45; cursor: not-allowed; }
    .breaches { display: flex; flex-wrap: wrap; gap: 8px; }
    .breach { border: 2px solid var(--danger); background: rgba(239,71,111,0.15); color: #fff; border-radius: 12px; padding: 10px 14px; font-weight: 800; cursor: pointer; }
    .breach:disabled { opacity: 0.5; }

    /* quiz */
    .quiz { position: absolute; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(3,9,16,0.9); }
    .quiz-inner { background: linear-gradient(155deg, #14263b, #0a1626); border: 2px solid var(--border); border-radius: 18px; padding: 18px; width: 100%; max-width: 470px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.85); max-height: 92%; overflow-y: auto; }
    .quiz-tag { font-size: 11px; color: var(--gold); font-weight: 800; text-transform: uppercase; letter-spacing: 2px; display: flex; justify-content: space-between; }
    .quiz-timer { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .quiz-timer div { height: 100%; border-radius: 3px; transition: width .25s linear; }
    .quiz-q { font-size: 15px; font-weight: 600; line-height: 1.5; }
    .quiz-q img { max-width: 100%; height: auto; border-radius: 8px; }
    .qgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .qbtn { border: 2px solid transparent; border-radius: 10px; padding: 13px 10px; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; text-align: left; line-height: 1.35; }
    .qbtn:disabled { cursor: default; color: #fff; }
    .qbtn:nth-child(4n+1) { background: #7f1d2c; } .qbtn:nth-child(4n+2) { background: #1d3a6e; }
    .qbtn:nth-child(4n+3) { background: #14532d; } .qbtn:nth-child(4n+4) { background: #6d4a12; }
    .qsub { background: linear-gradient(180deg, var(--gold-bright), #b3862f); border: none; border-radius: 10px; padding: 11px 24px; font-size: 14px; font-weight: 800; color: #221604; cursor: pointer; align-self: center; }
    .qinput, .qsel { width: 100%; background: #0d1c2e; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 10px 12px; color: #fff; font-size: 14px; }
    .qcheck { display: flex; align-items: center; gap: 9px; background: rgba(255,255,255,.06); border-radius: 8px; padding: 10px; cursor: pointer; font-size: 14px; }
    .qcheck input { width: 18px; height: 18px; accent-color: var(--gold); }
    .qpair { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; align-items: center; font-size: 13px; font-weight: 600; }
    .qform { display: flex; flex-direction: column; gap: 8px; }
    .feedback { text-align: center; font-size: 18px; font-weight: 900; }
    .fb-correct { color: var(--green); } .fb-wrong { color: var(--danger); }
    .fb-answer { text-align: center; font-size: 13px; color: #cfd8e3; }

    /* aim */
    .aim { position: absolute; inset: 0; z-index: 85; display: flex; flex-direction: column; }
    .aim-head { padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; background: rgba(3,9,16,0.75); font-size: 13px; font-weight: 900; color: var(--gold-bright); }
    .aim-track { height: 6px; background: rgba(255,255,255,0.12); }
    .aim-track div { height: 100%; background: var(--gold); }
    .aim-mid { flex: 1; position: relative; cursor: crosshair; touch-action: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(3,9,16,0.55) 100%); }
    .reticle { position: absolute; left: 50%; top: 50%; width: 74px; height: 74px; transform: translate(-50%,-50%); border: 2.5px solid #ffe08a; border-radius: 50%; box-shadow: 0 0 16px rgba(255,224,138,0.4); pointer-events: none; }
    .aim-hint { padding: 10px; text-align: center; font-size: 13px; font-weight: 700; color: #ffe9b8; background: rgba(3,9,16,0.75); }

    /* instant feedback while the board decides (ui.pending) */
    .qbtn.chosen { outline: 3px solid #fff; outline-offset: 1px; filter: brightness(1.25); }
    .sent { text-align: center; font-weight: 800; color: var(--gold-bright); }
    .power { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 8px; background: var(--gold); color: #221604; font-size: 11px; font-weight: 900; }

    /* review after a wrong answer */
    .review .quiz-inner { border-color: rgba(239,71,111,0.6); }
    .rv-list { display: flex; flex-direction: column; gap: 6px; }
    .rv-row { display: flex; gap: 9px; align-items: flex-start; background: rgba(255,255,255,.05); border-radius: 8px; padding: 9px 10px; font-size: 14px; opacity: .7; }
    .rv-row.rv-ok { background: rgba(46,194,126,.18); border: 1.5px solid var(--green); opacity: 1; font-weight: 700; }
    .rv-row.rv-bad { background: rgba(239,71,111,.15); border: 1.5px solid var(--danger); opacity: 1; }
    .rv-text { font-size: 14px; background: rgba(255,255,255,.05); border-radius: 8px; padding: 9px 10px; }
    .rv-text.rv-ok { background: rgba(46,194,126,.18); border: 1.5px solid var(--green); }
    .rv-expl { font-size: 13px; color: #cfd8e3; border-left: 3px solid var(--gold); padding-left: 10px; }
    .rv-wait { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; }
    .rv-wait div { height: 100%; background: var(--danger); transition: width .25s linear; }
    .wait-banner { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); z-index: 60; background: rgba(4,12,20,.9); border: 1px solid var(--border); border-radius: 12px; padding: 6px 14px; font-weight: 800; color: var(--gold-bright); }

    /* 2D deck: running sailor, flying cannonballs */
    .ships2d { position: relative; }
    .ship2d { text-align: center; line-height: 1; font-size: 44px; }
    .ship2d.shake { animation: shake .25s 3; }
    .deckbar { position: relative; height: 56px; border-radius: 14px; background: linear-gradient(180deg, #8a6134, #5d4326); border: 2px solid #3c2a18; }
    .deck-spot { position: absolute; top: 50%; transform: translate(-50%,-50%); font-size: 26px; opacity: .8; }
    .sailor { position: absolute; top: 50%; transform: translate(-50%,-50%); font-size: 30px; transition: left .7s linear; white-space: nowrap; }
    .ball2d { position: absolute; top: 40%; font-size: 22px; color: #111; text-shadow: 0 0 6px #fff; }
    .ball2d.out { animation: ball-out 1.1s ease-in-out forwards; }
    .ball2d.in { animation: ball-in 1.1s ease-in-out forwards; }
    @keyframes ball-out { 0% { left: 18%; transform: translateY(0); } 50% { transform: translateY(-46px); } 100% { left: 78%; transform: translateY(0); } }
    @keyframes ball-in { 0% { left: 78%; transform: translateY(0); } 50% { transform: translateY(-46px); } 100% { left: 18%; transform: translateY(0); } }
    .boom2d { position: absolute; top: 25%; font-size: 40px; animation: pop .8s ease-out forwards; }
    .boom2d.at-foe { left: 76%; } .boom2d.at-own { left: 12%; }
    @keyframes pop { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

    /* 2D aiming */
    .aim-2d { background: rgba(3,9,16,.85); }
    .aim-2d .aim-mid { overflow: hidden; background: linear-gradient(180deg, #7db9d6 0%, #cfe8ef 55%, #1d6a86 55%, #0d3a4f 100%); }
    .aim-foe { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-62%); font-size: 64px; text-align: center; line-height: 1; pointer-events: none; }
    .aim-ring { position: absolute; left: 50%; top: 50%; width: var(--r2, 180px); height: var(--r2, 180px); transform: translate(-50%,-50%); border: 2px dashed rgba(240,201,108,.55); border-radius: 50%; pointer-events: none; }
    .reticle2d { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 3px solid #ffe08a; border-radius: 50%; box-shadow: 0 0 14px rgba(255,224,138,.6); pointer-events: none; }

/* ═════════════════════════════════════════════════════════
   Rules (they run on the authority: the board, or the device in solo)
   ═════════════════════════════════════════════════════════ */
const SUPPORTED = ['true-false', 'mcq-single', 'mcq-multi', 'short-answer', 'match-pairs', 'sort-items'];
const AIM_MS = 6000;
/** After a wrong answer the player reads the correct one (and cannot act). */
const REVIEW_MS = 4500;
/** Running to a station takes the same time in 3D and 2D (fair for both). */
const WALK_MS = 700;
/** A wrong answer damages your own ship: a quick guess hurts more than a late try. */
const selfDamageFor = (leftMs, totalMs) => Math.round(15 + 20 * clamp(leftMs / totalMs, 0, 1));
// every / fix: ms between the computer's shots / repairs (repairs follow the same rules as a crew's).
const AI = {
  easy: { every: 12000, min: 20, max: 46, miss: 0.25, fix: 40000 },
  normal: { every: 12000, min: 28, max: 64, miss: 0.2, fix: 26000 },
  hard: { every: 10000, min: 32, max: 72, miss: 0.15, fix: 17000 },
};
const TEAMS = {
  red:   { flag: '🚩', color: '#e63946', hullColor: 0x6e3a24, trimColor: 0xb3202c, sailColor: 0xf1e4c8, flagColor: 0xe63946 },
  black: { flag: '🏴‍☠️', color: '#8d99ae', hullColor: 0x3d3128, trimColor: 0x22262e, sailColor: 0xd8d5cc, flagColor: 0x22262e },
};
const teamName = (t) => (t === 'red' ? L.redName : L.blackName);
/** The crew name, or "Enemy Galleon" for a crew sailed by the computer. */
const crewName = (state, t) => (state.ai === t ? L.soloEnemy : teamName(t));
/** Grammatical number of a crew name ("Corsairs" plural, "Brotherhood" and the galleon singular). */
const crewPlural = (state, t) => t === 'red' && state.ai !== 'red';
/** Strength of the computer ship (also in multiplayer): hull factor in multiplayer. */
const AI_HULL = { easy: 0.75, normal: 1, hard: 1.3 };
const otherTeam = (t) => (t === 'red' ? 'black' : 'red');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function teamOf(state, pid) {
  if (state?.teams?.red?.includes(pid)) return 'red';
  if (state?.teams?.black?.includes(pid)) return 'black';
  return null;
}
const blankStats = () => ({ fired: 0, hitCount: 0, repairs: 0, correct: 0, wrong: 0 });
const nextSeq = (state) => ++state.seq;
function pushFeed(state, ctx, entry) {
  state.feed.unshift({ ...entry, at: ctx.now });
  if (state.feed.length > 30) state.feed.length = 30;
}
function notice(state, pid, type) { state.notice[pid] = { seq: nextSeq(state), type }; }
/** Both ships get the same hull, growing with the bigger crew (the game does not end at once). */
/**
 * Net damage one sailor does per minute (shots minus what the other crew repairs);
 * the hulls are sized from it so that a battle takes about the expected minutes.
 * Calibrate after playtesting.
 */
const DAMAGE_PER_MINUTE = 150;
/** Hull per player of the bigger crew, from the "battle takes about" setting. */
const hullPerSailor = (settings) => DAMAGE_PER_MINUTE * clamp(Number(settings.expectedMin ?? 5), 2, 20);
/** Both ships get the same hull, growing with the bigger crew. */
const hullFor = (state) => Math.max(300, Math.round((state.hullPerSailor ?? 750) * Math.max(state.teams.red.length, state.teams.black.length)));
/**
 * The smaller crew plays "for more players": everything its sailors do counts
 * bigger / own times (shots, repairs, penalties, points). 1 vs 2 → ×2 and ×1.
 */
function powerOf(state, team) {
  if (state.solo) return 1; // solo has its own balance (AI table)
  const own = state.teams[team].length, other = state.teams[otherTeam(team)].length;
  return own > 0 && other > own ? other / own : 1;
}
const roundPower = (f) => Math.round(f * 100) / 100;

/** Grows or shrinks both hulls when the crews change, keeping the percentage. */
function rescaleHulls(state) {
  const max = hullFor(state);
  for (const team of ['red', 'black']) {
    const ship = state.ships[team];
    ship.hp = Math.round((ship.hp / ship.maxHp) * max);
    ship.maxHp = max;
  }
}

/**
 * Question slots: sailor no. 1 of each crew gets the same questions in the same
 * order, sailor no. 2 too, and so on (fair between crews, different between sailors).
 */
function assignSlots(state) {
  for (const team of ['red', 'black']) state.teams[team].forEach((pid, i) => { state.slots[pid] ??= i; });
}
const nameOf = (ctxOrUi, pid) => (pid === 'ai' ? L.soloEnemy : ctxOrUi.players.find((p) => p.id === pid)?.name ?? '?');

/** The swaying barrel: the same formula on the device (animation) and on the authority (hit). */
function sway(seed, elapsedMs) {
  const t = elapsedMs / 1000 + seed;
  return { yaw: Math.sin(t * 1.05) * 0.10 + Math.sin(t * 2.45) * 0.035, pitch: Math.sin(t * 1.65 + 1) * 0.055 + Math.cos(t * 0.85) * 0.03 };
}
const accuracyAt = (seed, elapsedMs) => { const s = sway(seed, elapsedMs); return clamp(1 - Math.hypot(s.yaw, s.pitch) / 0.13, 0, 1); };

function computeDamage(aimed, accuracy, mult, random) {
  if (aimed && typeof accuracy === 'number' && Number.isFinite(accuracy)) {
    const acc = clamp(accuracy, 0, 1);
    if (acc < 0.12) return { dmg: 0, label: 'miss' };
    let dmg = 30 + 115 * Math.pow(acc, 1.5);
    let label = 'hit';
    if (acc > 0.92) { dmg *= 1.35; label = 'crit'; }
    return { dmg: Math.round(dmg * mult), label };
  }
  const r = random();
  if (r < 0.08) return { dmg: 0, label: 'miss' };
  if (r > 0.87) return { dmg: Math.round((150 + random() * 40) * mult), label: 'crit' };
  return { dmg: Math.round((70 + random() * 60) * mult), label: 'hit' };
}

function startBattle(state, ctx) {
  const s = ctx.settings;
  state.hullPerSailor = hullPerSailor(s);
  if (state.solo) {
    const hull = hullFor(state);
    const aiHull = Math.round(hull * (AI_HULL[s.enemySkill] ?? 1));
    state.ships = { red: { hp: hull, maxHp: hull }, black: { hp: aiHull, maxHp: aiHull } };
  } else {
    const hull = hullFor(state);
    state.ships = { red: { hp: hull, maxHp: hull }, black: { hp: hull, maxHp: hull } };
    if (state.ai) {
      const aiHull = Math.round(hull * (AI_HULL[s.enemySkill] ?? 1));
      state.ships[state.ai] = { hp: aiHull, maxHp: aiHull };
    }
    pushFeed(state, ctx, { type: 'sys', key: 'start', r: state.teams.red.length, b: state.teams.black.length });
  }
  assignSlots(state);
  const ms = clamp(Number(s.battleMin ?? 10), 2, 40) * 60_000;
  state.battleEndsAt = ctx.now + ms;
  state.phase = 'battle';
  ctx.after(ms, 'timeUp', null, { key: 'battle' });
  if (state.ai) {
    const ai = AI[s.enemySkill] ?? AI.normal;
    ctx.after(ai.every, 'aiFire', null, { key: 'ai' });
    ctx.after(ai.fix, 'aiRepair', null, { key: 'aiFix' });
  }
}

function finishBattle(state, ctx, winner, reason) {
  if (state.phase !== 'battle') return;
  state.phase = 'finished';
  state.winner = winner;
  state.reason = reason;
  state.pending = {};
  state.aiming = {};
  ctx.cancel('battle');
  ctx.cancel('ai');
  pushFeed(state, ctx, { type: 'sys', key: winner === 'draw' ? 'draw' : 'win', team: winner });
  ctx.end({ scores: state.scores });
}

function finishByHull(state, ctx, reason) {
  const rf = state.ships.red.hp / state.ships.red.maxHp;
  const bf = state.ships.black.hp / state.ships.black.maxHp;
  finishBattle(state, ctx, Math.abs(rf - bf) < 0.001 ? 'draw' : rf > bf ? 'red' : 'black', reason);
}

function applyShot(state, ctx, team, res, by) {
  const foe = otherTeam(team);
  const x = ctx.random() * 1.8 - 0.9;
  const y = ctx.random();
  state.stats[team].fired += 1;
  if (res.dmg > 0) {
    state.ships[foe].hp = Math.max(0, state.ships[foe].hp - res.dmg);
    addBreach(state, ctx, foe, res.dmg, res.label, x, y);
    state.stats[team].hitCount += 1;
    if (by !== 'ai') state.scores[by] = (state.scores[by] ?? 0) + res.dmg;
    pushFeed(state, ctx, { type: res.label, by, team, dmg: res.dmg });
    if (state.ships[foe].hp <= 0) ctx.after(1800, 'finish', { winner: team }, { key: 'sunk' });
  } else {
    pushFeed(state, ctx, { type: 'miss', by, team });
  }
  state.lastShot = { seq: nextSeq(state), from: team, dmg: res.dmg, label: res.label, x, y, by };
}

/** A breach carries all of its damage; repairing it gets less efficient over time (repairEfficiency). */
const REPAIRABLE = 1;
/**
 * Repairs are strong at first (more than an average hit) and get weaker the more the
 * crew has repaired, measured in hulls (fair for crews of any size): 1.6x → 0.4x.
 */
const repairEfficiency = (state, team) => clamp(1.6 - 1.2 * ((state.repaired?.[team] ?? 0) / state.ships[team].maxHp), 0.4, 1.6);
const MAX_BREACHES = 16;

/** A new breach in a hull; it carries the damage that can still be repaired. */
function addBreach(state, ctx, team, dmg, sev, x, y) {
  const list = state.hits[team];
  list.push({ id: `h${nextSeq(state)}`, x, y, sev, left: Math.round(dmg * REPAIRABLE) });
  if (list.length > MAX_BREACHES) {
    const oldest = list.shift();
    list[0].left += oldest.left; // keep its damage repairable
  }
}

/**
 * One repair (a sailor's planks or the computer's carpenter). The planks fix the chosen
 * breach first; what is left over goes to the next ones (a strong repair closes several
 * small breaches, a big breach takes several repairs).
 */
function repairShip(state, ctx, team, hitId, by) {
  const list = state.hits[team];
  const i = list.findIndex((h) => h.id === hitId);
  if (i === -1) return;
  let budget = Math.round(100 * (0.75 + ctx.random() * 0.5) * powerOf(state, team) * repairEfficiency(state, team));
  let amount = 0;
  for (const breach of [list[i], ...list.filter((_, j) => j !== i)]) {
    if (budget <= 0) break;
    const used = Math.min(budget, breach.left ?? 100);
    breach.left = (breach.left ?? 100) - used;
    budget -= used;
    amount += used;
  }
  state.hits[team] = list.filter((h) => (h.left ?? 100) > 0);
  state.ships[team].hp = Math.min(state.ships[team].maxHp, state.ships[team].hp + amount);
  state.repaired ??= { red: 0, black: 0 };
  state.repaired[team] = (state.repaired[team] ?? 0) + amount;
  state.stats[team].repairs += 1;
  pushFeed(state, ctx, { type: 'repair', by, team, amount });
}

function selfDamage(state, ctx, team, dmg, pid) {
  const ship = state.ships[team];
  ship.hp = Math.max(0, ship.hp - dmg);
  addBreach(state, ctx, team, dmg, 'self', ctx.random() * 1.8 - 0.9, ctx.random() * 0.5);
  state.selfHit = { seq: nextSeq(state), team, dmg, by: pid };
  if (ship.hp <= 0) ctx.after(1800, 'finish', { winner: otherTeam(team) }, { key: 'sunk' });
}

/** The answer as given (for the review screen), kept small. */
function givenAnswer(answer) {
  if (typeof answer === 'string') return answer.slice(0, 200);
  return answer;
}

function playerFire(state, ctx, pid, accuracy) {
  const team = teamOf(state, pid);
  if (!team || state.inventory[pid] !== 'ball') return;
  state.inventory[pid] = null;
  delete state.aiming[pid];
  const mult = (1 + Math.min(state.streaks[pid] ?? 0, 5) * 0.06) * powerOf(state, team);
  applyShot(state, ctx, team, computeDamage(accuracy !== null, accuracy, mult, ctx.random), pid);
}

/** Answers from buttons and forms (form values are strings). */
function normalizeAnswer(item, p) {
  switch (item.type) {
    case 'mcq-single': return Number(p.answer);
    case 'true-false': return p.answer === true || p.answer === 'true';
    case 'mcq-multi': return [].concat(p.sel ?? []).map(Number);
    case 'short-answer': return String(p.text ?? '');
    case 'sort-items': return item.items.map((_, i) => Number(p[`o${i}`]));
    case 'match-pairs': return item.prompts.map((_, i) => Number(p[`p${i}`]));
    default: return null;
  }
}

/** Common checks of crew actions; returns the team or null. */
function crewMember(state, ctx, { allowStunned = false } = {}) {
  const pid = ctx.playerId;
  if (!pid || state.phase !== 'battle') return null;
  const team = teamOf(state, pid);
  if (!team) return null;
  if (!allowStunned && (state.stunnedUntil[pid] ?? 0) > ctx.now) { notice(state, pid, 'stunned'); return null; }
  return team;
}

const rules = {
  initialState(ctx) {
    const ids = ctx.items.filter((it) => SUPPORTED.includes(it.type)).map((it) => it.id);
    const state = {
      phase: 'teams', solo: ctx.mode === 'solo',
      teams: { red: [], black: [] }, scores: {}, inventory: {}, pending: {}, result: {}, notice: {}, aiming: {},
      stunnedUntil: {}, streaks: {}, positions: {},
      ships: { red: { hp: 1, maxHp: 1 }, black: { hp: 1, maxHp: 1 } }, hits: { red: [], black: [] },
      stats: { red: blankStats(), black: blankStats() }, feed: [], battleEndsAt: 0, winner: null, reason: null, lastShot: null,
      order: ctx.settings.doShuffle === false ? ids : ctx.shuffle(ids), qIdx: {}, slots: {}, slotStart: {}, seq: 0, ai: null,
      hullPerSailor: hullPerSailor(ctx.settings), repaired: { red: 0, black: 0 },
      aimMode: ctx.settings.aimMode !== false, timerSec: clamp(Number(ctx.settings.timerSec ?? 20), 5, 120),
    };
    for (const p of ctx.players) state.scores[p.id] = 0;
    if (state.solo) {
      state.teams.red = ctx.players.map((p) => p.id);
      state.teams.black = ['ai'];
      state.ai = 'black';
      startBattle(state, ctx);
    }
    return state;
  },

  playerJoined(state, player, ctx) {
    state.scores[player.id] ??= 0;
    if (state.phase === 'battle' && !teamOf(state, player.id)) {
      const side = state.ai ? otherTeam(state.ai) : state.teams.red.length <= state.teams.black.length ? 'red' : 'black';
      state.teams[side].push(player.id);
      state.slots[player.id] ??= state.teams[side].length - 1;
      rescaleHulls(state);
      pushFeed(state, ctx, { type: 'sys', key: 'join', by: player.id, team: side });
    }
  },

  actions: {
    /* ---- lobby ---- */
    join_team(state, { team } = {}, ctx) {
      if (state.phase !== 'teams' || !ctx.playerId || (team !== 'red' && team !== 'black')) return;
      state.teams.red = state.teams.red.filter((id) => id !== ctx.playerId);
      state.teams.black = state.teams.black.filter((id) => id !== ctx.playerId);
      state.teams[team].push(ctx.playerId);
    },
    balance(state, _p, ctx) {
      if (!ctx.fromHost || state.phase !== 'teams') return;
      const ids = ctx.shuffle(ctx.players.map((p) => p.id));
      state.teams = { red: [], black: [] };
      ids.forEach((pid, i) => state.teams[i % 2 === 0 ? 'red' : 'black'].push(pid));
    },
    begin(state, _p, ctx) {
      if (!ctx.fromHost || state.phase !== 'teams') return;
      for (const p of ctx.players) {
        if (!teamOf(state, p.id)) state.teams[state.teams.red.length <= state.teams.black.length ? 'red' : 'black'].push(p.id);
      }
      // Everyone in one crew: the computer sails the other ship.
      if (!state.teams.red.length || !state.teams.black.length) {
        const empty = state.teams.red.length ? 'black' : 'red';
        if (!state.teams[otherTeam(empty)].length) return;
        state.teams[empty] = ['ai'];
        state.ai = empty;
      }
      startBattle(state, ctx);
    },
    end_battle(state, _p, ctx) {
      if (ctx.fromHost && state.phase === 'battle') finishByHull(state, ctx, 'time');
    },

    /* ---- timers ---- */
    timeUp(state, _p, ctx) { if (state.phase === 'battle') finishByHull(state, ctx, 'time'); },
    finish(state, { winner } = {}, ctx) { finishBattle(state, ctx, winner, 'sunk'); },
    questionTimeout(state, { pid, seq } = {}, ctx) {
      const pending = state.pending[pid];
      if (!pending || pending.seq !== seq) return;
      delete state.pending[pid];
      state.qIdx[pid] = (state.qIdx[pid] ?? 0) + 1;
      state.stunnedUntil[pid] = ctx.now + REVIEW_MS;
      state.streaks[pid] = 0;
      const team = teamOf(state, pid);
      const dmg = team ? Math.round(selfDamageFor(0, 1) * powerOf(state, team)) : 0;
      if (team) state.scores[pid] = Math.max(0, (state.scores[pid] ?? 0) - dmg);
      state.result[pid] = { seq, correct: false, timedOut: true, itemId: pending.itemId, crate: pending.crate, dmg, given: null };
      if (team && state.phase === 'battle') {
        state.stats[team].wrong += 1;
        pushFeed(state, ctx, { type: 'wrong', by: pid, team, itemId: pending.itemId, dmg });
        selfDamage(state, ctx, team, dmg, pid);
      }
      ctx.recordAnswer(pending.itemId, false, { playerId: pid, isSkipped: true });
    },
    aimTimeout(state, { pid, seq } = {}, ctx) {
      const aim = state.aiming[pid];
      if (aim && aim.seq === seq && state.phase === 'battle') playerFire(state, ctx, pid, accuracyAt(aim.seed, AIM_MS));
    },
    aiFire(state, _p, ctx) {
      if (state.phase !== 'battle') return;
      const ai = AI[ctx.settings.enemySkill] ?? AI.normal;
      const power = powerOf(state, state.ai);
      const raw = ai.min + ctx.random() * (ai.max - ai.min);
      const res = ctx.random() < ai.miss ? { dmg: 0, label: 'miss' } : { dmg: Math.round(raw * power), label: raw > ai.max * 0.92 ? 'crit' : 'hit' };
      applyShot(state, ctx, state.ai, res, 'ai');
      ctx.after(Math.round(ai.every * (0.75 + ctx.random() * 0.5)), 'aiFire', null, { key: 'ai' });
    },
    aiRepair(state, _p, ctx) {
      if (state.phase !== 'battle') return;
      const ai = AI[ctx.settings.enemySkill] ?? AI.normal;
      const list = state.hits[state.ai];
      if (list.length) {
        // The biggest breach first, like a sensible carpenter.
        const biggest = list.reduce((a, b) => ((b.left ?? 100) > (a.left ?? 100) ? b : a));
        repairShip(state, ctx, state.ai, biggest.id, 'ai');
      }
      ctx.after(Math.round(ai.fix * (0.75 + ctx.random() * 0.5)), 'aiRepair', null, { key: 'aiFix' });
    },

    /* ---- crew ---- */
    move(state, { x } = {}, ctx) {
      if (!ctx.playerId || state.phase !== 'battle' || !Number.isFinite(Number(x))) return;
      state.positions[ctx.playerId] = clamp(Number(x), -4.9, 4.9);
    },
    request_question(state, { crate } = {}, ctx) {
      if (!crewMember(state, ctx)) return;
      const pid = ctx.playerId;
      crate = crate === 'material' ? 'material' : 'ammo';
      if (state.inventory[pid] === (crate === 'ammo' ? 'ball' : 'plank')) return notice(state, pid, 'hands');
      if (state.pending[pid]) return;
      if (!state.order.length) return notice(state, pid, 'noQuestions');
      assignSlots(state);
      const slot = state.slots[pid] ?? 0;
      state.slotStart[slot] ??= Math.floor(ctx.random() * state.order.length); // shared by sailor no. `slot` of both crews
      state.qIdx[pid] ??= 0;
      const itemId = state.order[(state.slotStart[slot] + state.qIdx[pid]) % state.order.length];
      const seq = nextSeq(state);
      state.pending[pid] = { seq, itemId, crate, deadline: ctx.now + state.timerSec * 1000 };
      ctx.after(state.timerSec * 1000 + 1000, 'questionTimeout', { pid, seq });
    },
    submit_answer(state, payload = {}, ctx) {
      const team = crewMember(state, ctx, { allowStunned: true });
      if (!team) return;
      const pid = ctx.playerId;
      const pending = state.pending[pid];
      if (!pending || pending.seq !== Number(payload.seq)) return;
      delete state.pending[pid];
      state.qIdx[pid] = (state.qIdx[pid] ?? 0) + 1;
      const item = ctx.item(pending.itemId);
      const answer = item ? normalizeAnswer(item, payload) : null;
      const correct = !!item && checkAnswer(item, answer);
      let dmg = 0;
      if (correct) {
        state.inventory[pid] = pending.crate === 'ammo' ? 'ball' : 'plank';
        state.scores[pid] = (state.scores[pid] ?? 0) + Math.round(50 * powerOf(state, team));
        state.streaks[pid] = (state.streaks[pid] ?? 0) + 1;
        state.stats[team].correct += 1;
        pushFeed(state, ctx, { type: 'correct', by: pid, team, crate: pending.crate, itemId: pending.itemId });
      } else {
        dmg = Math.round(selfDamageFor(pending.deadline - ctx.now, state.timerSec * 1000) * powerOf(state, team));
        state.scores[pid] = Math.max(0, (state.scores[pid] ?? 0) - dmg);
        state.stunnedUntil[pid] = ctx.now + REVIEW_MS;
        state.streaks[pid] = 0;
        state.stats[team].wrong += 1;
        pushFeed(state, ctx, { type: 'wrong', by: pid, team, itemId: pending.itemId, dmg });
        selfDamage(state, ctx, team, dmg, pid);
      }
      state.result[pid] = { seq: pending.seq, correct, timedOut: false, itemId: pending.itemId, crate: pending.crate, dmg, given: correct ? null : givenAnswer(answer) };
      ctx.recordAnswer(pending.itemId, correct);
    },
    aim(state, { cannon } = {}, ctx) {
      if (!crewMember(state, ctx)) return;
      const pid = ctx.playerId;
      if (state.inventory[pid] !== 'ball') return notice(state, pid, 'needBall');
      if (!state.aimMode) return playerFire(state, ctx, pid, null);
      const seq = nextSeq(state);
      state.aiming[pid] = { seq, start: ctx.now, seed: ctx.random() * 100, cannon: clamp(Number(cannon) || 0, 0, 2) };
      ctx.after(AIM_MS + 1500, 'aimTimeout', { pid, seq });
    },
    fire(state, { t } = {}, ctx) {
      if (!crewMember(state, ctx)) return;
      const pid = ctx.playerId;
      const aim = state.aiming[pid];
      if (!state.aimMode) return playerFire(state, ctx, pid, null);
      if (!aim) return; // with aiming on, every shot (3D or 2D) goes through the aiming
      // The authority computes the hit from the moment of the tap (not trusting a sent accuracy).
      const when = clamp(Number.isFinite(Number(t)) ? Math.min(Number(t), ctx.now) : ctx.now, aim.start, aim.start + AIM_MS);
      playerFire(state, ctx, pid, accuracyAt(aim.seed, when - aim.start));
    },
    repair(state, { hitId } = {}, ctx) {
      const team = crewMember(state, ctx);
      if (!team) return;
      const pid = ctx.playerId;
      if (state.inventory[pid] !== 'plank') return notice(state, pid, 'needPlank');
      const list = state.hits[team];
      const i = list.findIndex((h) => h.id === hitId);
      if (i === -1) return notice(state, pid, 'patched');
      state.inventory[pid] = null;
      repairShip(state, ctx, team, hitId, pid);
      state.scores[pid] = (state.scores[pid] ?? 0) + Math.round(75 * powerOf(state, team));
    },
  },
};

/* ═════════════════════════════════════════════════════════
   Device-local state (screens, 3D scene, messages)
   ═════════════════════════════════════════════════════════ */
const G = {
  state: null, ui: null, me: null, team: null,
  mode2d: false, reason2d: null, userChose: false,
  float: null, feedback: null,
  seen: null,               // last processed seq of shots / notices / results
  finishedAt: null,
};
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const fmtTime = (ms) => { const sec = Math.ceil(Math.max(0, ms) / 1000); return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`; };
function floatMsg(text, color = '#fff', ms = 1600) { G.float = { text, color, until: performance.now() + ms }; }
const pct = (ship) => (ship ? clamp((ship.hp / ship.maxHp) * 100, 0, 100) : 0);

/** A small seeded shuffle for displaying options (stable across renders). */
function stableShuffle(list, seed) {
  const a = list.map((v, i) => ({ v, i }));
  let s = seed * 9301 + 49297;
  for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* ═════════════════════════════════════════════════════════
   Rendering: board
   ═════════════════════════════════════════════════════════ */
function chipList(ids, ui, meId) {
  return ids.map((pid) => `<span class="chip${pid === meId ? ' me' : ''}">${esc(nameOf(ui, pid))}</span>`).join('') || `<span class="muted">${L.noSailors}</span>`;
}

function renderBoardLobby(state, ui) {
  const all = ui.players.map((p) => p.id);
  const undecided = ui.players.filter((p) => !teamOf(state, p.id));
  return `<section class="screen"><div class="panel" style="max-width:820px">
    <div class="big-emoji">⚓</div>
    <div class="panel-title">${L.musterTitle}</div>
    <div class="panel-sub">${L.musterSub}</div>
    <div class="teams-wrap">
      ${['red', 'black'].map((t) => `<div class="team-card ${t}-side">
        <div class="team-flag">${TEAMS[t].flag}</div><div class="team-name">${teamName(t)}</div>
        <div class="team-count">${L.sailors(state.teams[t].length)}</div>
        <div class="team-roster">${chipList(state.teams[t], ui)}</div></div>`).join('')}
    </div>
    <div class="muted" style="margin-top:10px">${undecided.length ? esc(L.undecided(undecided.map((p) => p.name).join(', '))) : L.allChosen}</div>
    <div class="row">
      <button class="gbtn sec" data-act="balance">${L.balance}</button>
      <button class="gbtn pri" data-act="begin" ${all.length < 1 ? 'disabled' : ''}>${L.begin}</button>
    </div>
  </div></section>`;
}

function feedLine(f, ui, state) {
  const who = f.by ? `<b style="color:${f.team ? TEAMS[f.team].color : '#fff'}">${esc(nameOf(ui, f.by))}</b>` : '';
  const q = f.itemId ? ui.item(f.itemId) : null;
  const detail = q ? `<div class="feed-detail">${ui.text(q.question ?? '', { inline: true, item: q })}</div>` : '';
  switch (f.type) {
    case 'hit': return `<div class="feed-item hit"><div>💥</div><div>${L.feedHit(who, f.dmg, f.by === 'ai')}</div></div>`;
    case 'crit': return `<div class="feed-item crit"><div>🎯</div><div>${L.feedCrit(who, f.dmg)}</div></div>`;
    case 'miss': return `<div class="feed-item miss"><div>🌊</div><div>${L.feedMiss(who, f.by === 'ai')}</div></div>`;
    case 'repair': return `<div class="feed-item repair"><div>🔨</div><div>${L.feedRepair(who, f.amount ?? 100, f.by === 'ai')}</div></div>`;
    case 'correct': return `<div class="feed-item correct"><div>✅</div><div>${L.feedCorrect(who, f.crate)}${detail}</div></div>`;
    case 'wrong': return `<div class="feed-item wrong"><div>❌</div><div>${L.feedWrong(who, f.dmg ?? 0)}${detail}</div></div>`;
    case 'sys': {
      const text = f.key === 'start' ? L.feedStart(f.r, f.b) : f.key === 'join' ? L.feedJoin(esc(nameOf(ui, f.by)), teamName(f.team)) : f.key === 'win' ? L.feedWin(crewName(state, f.team), crewPlural(state, f.team)) : L.feedDraw;
      return `<div class="feed-item sys"><div>⚓</div><div>${text}</div></div>`;
    }
    default: return '';
  }
}

function renderBoardBattle(state, ui) {
  return `<div class="dash">
    <div class="hd-bar">
      <span class="hd-title">🏴‍☠️ Pirates of Memizy</span>
      <span class="hd-timer">${fmtTime(ui.timeLeft(state.battleEndsAt))}</span>
      <button class="gbtn danger" style="padding:8px 14px;font-size:13px" data-act="end_battle">${L.endBattle}</button>
    </div>
    <div class="hd-ships">
      ${['red', 'black'].map((t) => {
        const ship = state.ships[t], st = state.stats[t];
        return `<div class="hd-ship ${t}-side">
          <div class="hd-ship-head"><span style="color:var(--${t}-team-soft)">${state.ai === t ? '☠️' : TEAMS[t].flag} ${crewName(state, t)}${powerOf(state, t) > 1 ? `<span class="power" title="${L.strengthHint}">${L.strength(roundPower(powerOf(state, t)))}</span>` : ''}</span><span>${Math.max(0, Math.round(ship.hp))} / ${ship.maxHp}</span></div>
          <div class="hpbar"><div class="hpfill" style="width:${pct(ship)}%;background:linear-gradient(90deg,${t === 'red' ? '#8c1823,var(--red-team)' : '#4a5670,var(--black-team)'})"></div></div>
          <div class="hd-ship-stats"><span>💥 ${st.fired} ${L.fired}</span><span>🎯 ${st.hitCount} ${L.hits}</span><span>🔨 ${st.repairs} ${L.repairs}</span><span>✅ ${st.correct}</span><span>❌ ${st.wrong}</span></div>
          <div class="team-roster" style="justify-content:flex-start;margin-top:10px">${state.teams[t].map((pid) => `<span class="chip">${esc(nameOf(ui, pid))} <b style="color:var(--gold)">${state.scores[pid] ?? 0}</b></span>`).join('')}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="section-lbl">${L.battleLog}</div>
    <div class="feed">${state.feed.slice(0, 20).map((f) => feedLine(f, ui, state)).join('') || `<div class="muted">${L.calmSea}</div>`}</div>
  </div>`;
}

function leaderboardHtml(state, ui) {
  const medals = ['🥇', '🥈', '🥉'];
  return ui.players
    .map((p) => ({ id: p.id, name: p.name, score: state.scores[p.id] ?? 0, team: teamOf(state, p.id) }))
    .sort((a, b) => b.score - a.score)
    .map((r, i) => `<div class="lb-row"><span class="lb-rank">${medals[i] || `${i + 1}.`}</span>
      <span class="lb-dot" style="background:${r.team ? TEAMS[r.team].color : '#666'}"></span>
      <span style="flex:1">${esc(r.name)}</span><span class="lb-score">${r.score}</span></div>`).join('');
}

function renderBoardFinished(state, ui) {
  const w = state.winner, r = state.ships.red, b = state.ships.black;
  const correct = state.stats.red.correct + state.stats.black.correct;
  return `<section class="screen"><div class="panel" style="max-width:520px">
    <div class="big-emoji">${!w || w === 'draw' ? '🤝' : TEAMS[w].flag}</div>
    <div class="panel-title">${!w || w === 'draw' ? L.drawTitle : L.winsTitle(crewName(state, w), crewPlural(state, w))}</div>
    <div class="panel-sub">${state.reason === 'sunk' ? L.sunkSub : L.timeSub}</div>
    <div class="muted" style="margin-bottom:14px;font-size:14px">🚩 ${L.hull} <b>${Math.round(pct(r))} %</b> · 🏴‍☠️ ${L.hull} <b>${Math.round(pct(b))} %</b> · ✅ ${correct} ${L.correctAnswers}</div>
    ${leaderboardHtml(state, ui)}
  </div></section>`;
}
