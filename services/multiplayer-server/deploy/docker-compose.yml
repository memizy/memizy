# Memizy multiplayer server in production (Netcup): the relay behind a
# Cloudflare Tunnel. No port is published: cloudflared connects out to
# Cloudflare, which terminates TLS for mp.memizy.com.
# Secrets: TUNNEL_TOKEN in /opt/memizy/.env on the server (never in git).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  relay:
    build: ./relay
    restart: unless-stopped
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      # Client IPs come from CF-Connecting-IP (the relay is reachable only through the tunnel).
      TRUST_PROXY: "1"
      ALLOWED_ORIGINS: "https://play.memizy.com,https://memizy.com"
    logging: *logging
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in /opt/memizy/.env}
    depends_on:
      - relay
    logging: *logging
