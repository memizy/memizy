# Publishes the OQSE web validator (packages/oqse/docs) to GitHub Pages:
# https://memizy.github.io/memizy/
# Repository settings: Pages -> Source: GitHub Actions.
name: OQSE Pages

on:
  push:
    branches: [main]
    paths: ['packages/oqse/docs/**', '.github/workflows/oqse-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: oqse-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/oqse/docs
      - id: deployment
        uses: actions/deploy-pages@v4
